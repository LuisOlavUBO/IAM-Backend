# Entorno de DESARROLLO: docker compose up -d --build  ->  http://localhost:8003
# Laravel lee el .env directamente desde el bind mount, así que sus cambios aplican sin recrear el contenedor.
# Si cambias composer.json/composer.lock: docker compose up -d --build -V (renueva el volumen de vendor).
# Para los tests contra SQL Server en Docker: docker compose --profile tests up -d sqlserver sqlserver-init (ver README).
name: api-iam

services:
    app:
        container_name: api-iam-dev
        image: api-iam:dev
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                USER_ID: ${UID:-1000}
                GROUP_ID: ${GID:-1000}
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        expose:
            - "9000"

    nginx:
        container_name: api-iam-nginx-dev
        image: nginx:1.27-alpine
        ports:
            - "${DOCKER_HTTP_PORT:-8003}:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    # Solo para los tests (perfil "tests": docker compose up -d no los levanta). La API de desarrollo
    # sigue usando la base del .env. Requieren DOCKER_MSSQL_SA_PASSWORD en el .env. El puerto por defecto
    # (14335) no choca con los SQL Server de API-Maestros (14333) ni de API-Auth (14334).
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        profiles: [tests]
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: ${DOCKER_MSSQL_SA_PASSWORD:-}
            MSSQL_PID: Developer
        ports:
            - "${DOCKER_MSSQL_PORT:-14335}:1433"
        volumes:
            - sqlserver-data:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    # Crea la base de pruebas con la intercalación de la base IAM la primera vez (idempotente).
    sqlserver-init:
        image: mcr.microsoft.com/mssql/server:2022-latest
        profiles: [tests]
        environment:
            MSSQL_SA_PASSWORD: ${DOCKER_MSSQL_SA_PASSWORD:-}
        entrypoint:
            - /bin/bash
            - -c
            - >-
                /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q
                "IF DB_ID('IAM_test') IS NULL CREATE DATABASE IAM_test COLLATE SQL_Latin1_General_CP1_CI_AS;"
        depends_on:
            sqlserver:
                condition: service_healthy
        restart: "no"

volumes:
    sqlserver-data:
