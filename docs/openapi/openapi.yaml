openapi: 3.1.0
info:
  title: API-IAM
  version: 0.1.0
  description: |
    Backend de administración de IAM de la UBO: usuarios, catálogo (aplicaciones, roles y permisos),
    clientes OAuth y auditoría. Es dueño de los datos de identidad y acceso que usa API-Auth para emitir tokens.
    Lo consume el portal Angular de IAM como BFF (backend-for-frontend), en el mismo origen.

    Todas las rutas viven bajo `/api/iam`, y las de la versión 1 bajo `/api/iam/v1`.

    **Respuestas:** los datos van en `data` y la información adicional (como la paginación) en `meta`.

    **Errores:** las rutas `/api/iam/*` responden los errores en RFC 9457 (`application/problem+json`)
    con un código estable en `error`, como las demás APIs de la UBO:

    | `error` | Estado | Cuándo |
    |---|---|---|
    | `VALIDACION` | 422 | Datos inválidos; los mensajes por campo van en `errores` |
    | `RUTA_NO_ENCONTRADA` / `METODO_NO_PERMITIDO` | 404 / 405 | La ruta o el método no existen |
    | `ERROR_INTERNO` | 500 | Error inesperado; el detalle queda solo en el log |

    Toda respuesta trae el header `X-Trace-Id` con el `trace_id` de la petición (UBO.Common, módulo Tracing).
    Si se envía un `traceparent` (W3C Trace Context), la traza continúa.
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Salud
    description: Estado del servicio.

paths:
  /api/iam/v1/salud:
    get:
      tags: [Salud]
      summary: Estado de la API y de la base de datos
      description: |
        Ejecuta una consulta trivial en la base de datos `IAM`. Lo usa el healthcheck de nginx en
        `docker-compose.prod.yml`. Misma forma que en las demás APIs de la UBO (módulo Health de UBO.Common).
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [OK] }
                  base_datos: { type: string, enum: [OK] }
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [ERROR] }
                  base_datos: { type: string, enum: [NO_DISPONIBLE] }

components:
  schemas:
    Problema:
      type: object
      description: Error en formato RFC 9457 (`application/problem+json`).
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, const: about:blank }
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de este caso en particular.
        error:
          type: string
          description: Código estable para el programa que llama (ver la descripción de la API).

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            error: { const: VALIDACION }
            errores:
              type: object
              description: Mensajes de error por campo.
              additionalProperties:
                type: array
                items: { type: string }

    MetaPaginacion:
      type: object
      description: Paginación de una lista (`meta` de las respuestas que listan).
      required: [total, pagina, por_pagina]
      properties:
        total:
          type: integer
          description: Cantidad total de elementos que cumplen el filtro.
        pagina:
          type: integer
          minimum: 1
          description: Página devuelta.
        por_pagina:
          type: integer
          minimum: 1
          description: Elementos por página.

  responses:
    Validacion:
      description: Datos inválidos (`VALIDACION`), con los mensajes por campo en `errores`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
    ErrorInterno:
      description: Error inesperado (`ERROR_INTERNO`). El detalle queda solo en el log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Error interno
            status: 500
            detail: Ocurrió un error inesperado.
            error: ERROR_INTERNO
