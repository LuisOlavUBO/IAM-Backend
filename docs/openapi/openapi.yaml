openapi: 3.1.0
info:
  title: API-IAM
  version: 0.2.0
  description: |
    Backend de administración de IAM de la UBO: usuarios, aplicaciones (con sus roles y permisos),
    clientes OAuth y auditoría. Es dueño de los datos de identidad y acceso que usa API-Auth para emitir tokens.
    Lo consume el portal Angular de IAM como BFF (backend-for-frontend), en el mismo origen.

    Todas las rutas viven bajo `/api/iam`, y las de la versión 1 bajo `/api/iam/v1`.

    **Respuestas:** los datos van en `data` y la información adicional (como la paginación) en `meta`.

    **Sesión del portal (BFF):** Angular se sirve en el mismo origen y nunca ve un token. La persona entra por el
    SSO de IAM navegando a `/api/iam/v1/auth/login`; API-IAM guarda los tokens en el servidor y el navegador solo
    recibe la cookie de sesión. Las rutas del portal exigen esa sesión (`401 NO_AUTENTICADO` sin ella) y un permiso
    `iam:*` (`403` sin él). Las que cambian datos exigen además el token CSRF: Angular lo envía solo en el header
    `X-XSRF-TOKEN`, tomado de la cookie `XSRF-TOKEN` (`419` sin él).

    **Errores:** las rutas `/api/iam/*` responden los errores en RFC 9457 (`application/problem+json`)
    con un código estable en `error`, como las demás APIs de la UBO:

    | `error` | Estado | Cuándo |
    |---|---|---|
    | `NO_AUTENTICADO` | 401 | No hay sesión del portal |
    | `ACCESO_DENEGADO` | 403 | La persona no tiene el permiso `iam:*` que exige la ruta |
    | `VALIDACION` | 422 | Datos inválidos; los mensajes por campo van en `errores` |
    | `USUARIO_NO_ENCONTRADO` | 404 | No existe una persona con ese `uuid` |
    | `RUTA_NO_ENCONTRADA` / `METODO_NO_PERMITIDO` | 404 / 405 | La ruta o el método no existen |
    | `ERROR_INTERNO` | 500 | Error inesperado; el detalle queda solo en el log |

    Toda respuesta trae el header `X-Trace-Id` con el `trace_id` de la petición (UBO.Common, módulo Tracing).
    Si se envía un `traceparent` (W3C Trace Context), la traza continúa.
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Acceso
    description: Inicio y cierre de sesión del portal por el SSO de IAM, y la persona con sesión.
  - name: Usuarios
    description: Personas de IAM. Consulta con el permiso `iam:usuarios.leer`.
  - name: Aplicaciones
    description: Sistemas registrados en IAM, con sus permisos y roles. Consulta con el permiso `iam:aplicaciones.leer`.
  - name: Salud
    description: Estado del servicio.

paths:
  /api/iam/v1/auth/login:
    get:
      tags: [Acceso]
      summary: Iniciar sesión (navegación del navegador)
      description: |
        Redirige al login central de IAM (Authorization Code con PKCE `S256`, cliente del portal). Es una
        navegación completa, no una llamada de `HttpClient`. Al terminar, la persona vuelve a `redirect` (solo
        rutas de este origen) o a la página inicial.
      operationId: iniciarSesion
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Ruta del portal a la que volver después del login (por ejemplo `/usuarios`).
          schema: { type: string }
      responses:
        '302':
          description: Redirección a `/api/auth/oauth/authorize` de IAM.

  /api/iam/v1/auth/callback:
    get:
      tags: [Acceso]
      summary: Fin del inicio de sesión (lo llama IAM)
      description: |
        IAM vuelve aquí con `code` y `state`. API-IAM canjea el código en el servidor, abre la sesión y
        redirige a la ruta pedida. Si el login falla, redirige a la página inicial con `error_login`:

        | `error_login` | Cuándo |
        |---|---|
        | `SIN_ACCESO` | La persona no tiene roles en `iam-admin` o IAM no autorizó el login |
        | `LOGIN_INVALIDO` | El login no se inició en ese navegador, venció o IAM rechazó el código |
        | `IAM_NO_DISPONIBLE` | IAM no respondió |
      operationId: finInicioSesion
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: A la ruta pedida con la cookie de sesión, o a la página inicial con `error_login`.

  /api/iam/v1/auth/logout:
    post:
      tags: [Acceso]
      summary: Cerrar sesión (formulario del navegador)
      description: |
        Revoca en IAM el token de la sesión, cierra la sesión local y redirige al logout central de IAM, que
        vuelve al portal. Se envía como formulario `POST` con el campo `_token` (el `csrf` de `/me`), no con
        `HttpClient`. Con `scope=local` cierra solo la sesión del portal.
      operationId: cerrarSesion
      security:
        - sesionPortal: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [_token]
              properties:
                _token:
                  type: string
                  description: Token CSRF (`csrf` de `/me`).
                scope:
                  type: string
                  enum: [local]
      responses:
        '302':
          description: Redirección a `/api/auth/logout` de IAM.
        '419':
          description: Falta el token CSRF o no es válido.

  /api/iam/v1/me:
    get:
      tags: [Acceso]
      summary: Persona con sesión
      description: Quién es la persona y qué permisos `iam:*` tiene. Angular arma su menú con `permisos`.
      operationId: me
      security:
        - sesionPortal: []
      responses:
        '200':
          description: La persona con sesión.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uuid, nombre, correo, roles, permisos, csrf]
                    properties:
                      uuid:
                        type: string
                        format: uuid
                        description: Identificador público de la persona, en minúsculas.
                      nombre:
                        type: [string, 'null']
                      correo:
                        type: [string, 'null']
                        format: email
                      roles:
                        type: array
                        items: { type: string }
                        example: [administrador]
                      permisos:
                        type: array
                        items: { type: string }
                        example: ['iam:usuarios.leer', 'iam:usuarios.administrar']
                      csrf:
                        type: string
                        description: Token CSRF para el formulario de logout.
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/iam/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: |
        Personas de IAM ordenadas por nombre, paginadas. `buscar` filtra por nombre o correo que contengan el texto
        (sin distinguir mayúsculas, sí tildes) y, si el texto es un RUT válido con o sin puntos, por ese RUT.
        Nunca incluye contraseñas, `entra_oid` ni ids internos.
      operationId: listarUsuarios
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre o del correo, o un RUT (`12.345.678-5`, `12345678-5` o `123456785`).
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [activos, baja, todos], default: todos }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de personas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UsuarioResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/usuarios/{uuid}:
    get:
      tags: [Usuarios]
      summary: Ver un usuario
      description: Datos de cuenta de la persona y sus roles agrupados por aplicación (ambos ordenados por nombre).
      operationId: verUsuario
      security:
        - sesionPortal: []
      parameters:
        - name: uuid
          in: path
          required: true
          description: Identificador público de la persona (sin distinguir mayúsculas).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La persona.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe una persona con ese `uuid`, o no tiene formato de UUID (`USUARIO_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Usuario no encontrado
                status: 404
                detail: No existe una persona con ese identificador.
                error: USUARIO_NO_ENCONTRADO

  /api/iam/v1/aplicaciones:
    get:
      tags: [Aplicaciones]
      summary: Listar aplicaciones
      description: |
        Aplicaciones de IAM ordenadas por nombre, paginadas, con la cantidad de permisos y roles de cada una.
        `buscar` filtra por nombre o descripción que contengan el texto (sin distinguir mayúsculas).
        Nunca incluye ids internos.
      operationId: listarAplicaciones
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre o de la descripción.
          schema: { type: string, maxLength: 100 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de aplicaciones.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AplicacionResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/aplicaciones/{nombre}:
    get:
      tags: [Aplicaciones]
      summary: Ver una aplicación
      description: La aplicación con sus permisos y sus roles, y los permisos que da cada rol (todo ordenado por nombre).
      operationId: verAplicacion
      security:
        - sesionPortal: []
      parameters:
        - name: nombre
          in: path
          required: true
          description: Nombre de la aplicación (sin distinguir mayúsculas).
          schema: { type: string, example: iam-admin }
      responses:
        '200':
          description: La aplicación.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AplicacionDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe una aplicación con ese nombre (`APLICACION_NO_ENCONTRADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Aplicación no encontrada
                status: 404
                detail: No existe una aplicación con ese nombre.
                error: APLICACION_NO_ENCONTRADA

  /api/iam/v1/salud:
    get:
      tags: [Salud]
      summary: Estado de la API y de la base de datos
      description: |
        Ejecuta una consulta trivial en la base de datos `IAM`. Lo usa el healthcheck de nginx en
        `docker-compose.prod.yml`. Misma forma que en las demás APIs de la UBO (módulo Health de UBO.Common).
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [OK] }
                  base_datos: { type: string, enum: [OK] }
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [ERROR] }
                  base_datos: { type: string, enum: [NO_DISPONIBLE] }

components:
  securitySchemes:
    sesionPortal:
      type: apiKey
      in: cookie
      name: api-iam-session
      description: Cookie de sesión del portal, que se obtiene con el login. Su nombre real es el de `SESSION_COOKIE`.

  schemas:
    Problema:
      type: object
      description: Error en formato RFC 9457 (`application/problem+json`).
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, const: about:blank }
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de este caso en particular.
        error:
          type: string
          description: Código estable para el programa que llama (ver la descripción de la API).

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            error: { const: VALIDACION }
            errores:
              type: object
              description: Mensajes de error por campo.
              additionalProperties:
                type: array
                items: { type: string }

    MetaPaginacion:
      type: object
      description: Paginación de una lista (`meta` de las respuestas que listan).
      required: [total, pagina, por_pagina]
      properties:
        total:
          type: integer
          description: Cantidad total de elementos que cumplen el filtro.
        pagina:
          type: integer
          minimum: 1
          description: Página devuelta.
        por_pagina:
          type: integer
          minimum: 1
          description: Elementos por página.

    UsuarioResumen:
      type: object
      required: [uuid, nombre, correo, rut, estado]
      properties:
        uuid:
          type: string
          format: uuid
          description: Identificador público de la persona, en minúsculas.
        nombre: { type: string, example: Ana Pérez }
        correo: { type: string, format: email, example: ana@ubo.cl }
        rut:
          type: [string, 'null']
          description: RUT normalizado (sin puntos, con guion y `K` mayúscula).
          example: 12345678-5
        estado:
          type: string
          enum: [activo, baja]

    UsuarioDetalle:
      allOf:
        - $ref: '#/components/schemas/UsuarioResumen'
        - type: object
          required: [baja_desde, tiene_clave, microsoft_vinculado, clave_temporal_vence, creado, actualizado, aplicaciones]
          properties:
            baja_desde:
              type: [string, 'null']
              format: date-time
              description: Desde cuándo está dada de baja.
            tiene_clave:
              type: boolean
              description: Tiene contraseña de IAM (sin revelarla).
            microsoft_vinculado:
              type: boolean
              description: Ya entró con su cuenta Microsoft.
            clave_temporal_vence:
              type: [string, 'null']
              format: date-time
              description: Vencimiento de la clave temporal, si la tiene.
            creado: { type: [string, 'null'], format: date-time }
            actualizado: { type: [string, 'null'], format: date-time }
            aplicaciones:
              type: array
              description: Aplicaciones donde la persona tiene roles.
              items:
                type: object
                required: [nombre, descripcion, roles]
                properties:
                  nombre: { type: string, example: iam-admin }
                  descripcion: { type: [string, 'null'] }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [nombre, descripcion]
                      properties:
                        nombre: { type: string, example: administrador }
                        descripcion: { type: [string, 'null'] }

    AplicacionResumen:
      type: object
      required: [nombre, descripcion, permisos, roles]
      properties:
        nombre:
          type: string
          description: Nombre único de la aplicación; la identifica en la URL.
          example: iam-admin
        descripcion: { type: [string, 'null'], example: Portal de administración de IAM }
        permisos:
          type: integer
          description: Cantidad de permisos que define.
          example: 7
        roles:
          type: integer
          description: Cantidad de roles que define.
          example: 2

    AplicacionDetalle:
      type: object
      required: [nombre, descripcion, creada, actualizada, permisos, roles]
      properties:
        nombre: { type: string, example: iam-admin }
        descripcion: { type: [string, 'null'] }
        creada: { type: [string, 'null'], format: date-time }
        actualizada: { type: [string, 'null'], format: date-time }
        permisos:
          type: array
          description: Permisos de la aplicación, ordenados por nombre.
          items:
            type: object
            required: [nombre, descripcion]
            properties:
              nombre: { type: string, example: 'iam:usuarios.leer' }
              descripcion: { type: string, example: Ver usuarios y sus roles }
        roles:
          type: array
          description: Roles de la aplicación, ordenados por nombre.
          items:
            type: object
            required: [nombre, descripcion, permisos]
            properties:
              nombre: { type: string, example: mesa-de-ayuda }
              descripcion: { type: [string, 'null'] }
              permisos:
                type: array
                description: Nombres de los permisos que da el rol, ordenados.
                items: { type: string }
                example: ['iam:aplicaciones.leer', 'iam:usuarios.administrar', 'iam:usuarios.leer']

  responses:
    NoAutenticado:
      description: No hay sesión del portal (`NO_AUTENTICADO`). Angular debe navegar a `/api/iam/v1/auth/login`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Se requiere un token de acceso válido, vigente y no revocado.
            error: NO_AUTENTICADO
    AccesoDenegado:
      description: La persona no tiene el permiso `iam:*` que exige la ruta (`ACCESO_DENEGADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Validacion:
      description: Datos inválidos (`VALIDACION`), con los mensajes por campo en `errores`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
    ErrorInterno:
      description: Error inesperado (`ERROR_INTERNO`). El detalle queda solo en el log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Error interno
            status: 500
            detail: Ocurrió un error inesperado.
            error: ERROR_INTERNO
