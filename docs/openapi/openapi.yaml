openapi: 3.1.0
info:
  title: API-IAM
  version: 0.2.0
  description: |
    Backend de administración de IAM de la UBO: usuarios, aplicaciones (con sus roles y permisos),
    clientes OAuth y auditoría. Es dueño de los datos de identidad y acceso que usa API-Auth para emitir tokens.
    Lo consume el portal Angular de IAM como BFF (backend-for-frontend), en el mismo origen.

    Todas las rutas viven bajo `/api/iam`, y las de la versión 1 bajo `/api/iam/v1`.

    **Respuestas:** los datos van en `data` y la información adicional (como la paginación) en `meta`.

    **Sesión del portal (BFF):** Angular se sirve en el mismo origen y nunca ve un token. La persona entra por el
    SSO de IAM navegando a `/api/iam/v1/auth/login`; API-IAM guarda los tokens en el servidor y el navegador solo
    recibe la cookie de sesión. Las rutas del portal exigen esa sesión (`401 NO_AUTENTICADO` sin ella) y un permiso
    `iam:*` (`403` sin él). Las que cambian datos exigen además el token CSRF: Angular lo envía solo en el header
    `X-XSRF-TOKEN`, tomado de la cookie `XSRF-TOKEN` (`419` sin él).

    **Errores:** las rutas `/api/iam/*` responden los errores en RFC 9457 (`application/problem+json`)
    con un código estable en `error`, como las demás APIs de la UBO:

    | `error` | Estado | Cuándo |
    |---|---|---|
    | `NO_AUTENTICADO` | 401 | No hay sesión del portal |
    | `ACCESO_DENEGADO` | 403 | La persona no tiene el permiso `iam:*` que exige la ruta |
    | `VALIDACION` | 422 | Datos inválidos; los mensajes por campo van en `errores` |
    | `USUARIO_NO_ENCONTRADO` | 404 | No existe una persona con ese `uuid` |
    | `APLICACION_NO_ENCONTRADA` | 404 | No existe una aplicación con ese nombre |
    | `CLIENTE_NO_ENCONTRADO` | 404 | No existe un cliente OAuth con ese id |
    | `ROL_NO_ASIGNADO` | 404 | La persona o el cliente no tiene ese rol |
    | `CLIENTE_DE_IAM_ADMIN` | 409 | Revocar un cliente de `iam-admin`, o cambiar sus roles o redirecciones |
    | `CLIENTE_SIN_ROLES` | 409 | Asignar o quitar roles a un cliente de login (`authorization-code`): sus tokens llevan los roles de la persona |
    | `ROL_DE_IAM_ADMIN` | 409 | Asignar a un cliente un rol de `iam-admin` |
    | `CLIENTE_SIN_REDIRECCIONES` | 409 | Cambiar las redirecciones de un cliente de servicio (`client-credentials`) |
    | `ESCALAMIENTO_DE_PRIVILEGIOS` | 403 | Asignar o quitar un rol de `iam-admin`, o dar de baja, reactivar o reiniciar la clave de una persona con roles de `iam-admin`, sin todos los permisos de `iam-admin` |
    | `ACCION_SOBRE_SI_MISMO` | 403 | Cambiar los propios roles, cerrar las propias sesiones, darse de baja o reiniciar la propia clave |
    | `ULTIMO_ADMINISTRADOR` | 409 | Quitar `iam-admin/administrador` a la última persona activa que lo tiene, o darla de baja |
    | `REVOCACION_FALLIDA` | 502 | API-Auth no confirmó el cierre de las sesiones; se puede reintentar |
    | `RUTA_NO_ENCONTRADA` / `METODO_NO_PERMITIDO` | 404 / 405 | La ruta o el método no existen |
    | `ERROR_INTERNO` | 500 | Error inesperado; el detalle queda solo en el log |

    Toda respuesta trae el header `X-Trace-Id` con el `trace_id` de la petición (UBO.Common, módulo Tracing).
    Si se envía un `traceparent` (W3C Trace Context), la traza continúa.
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Acceso
    description: Inicio y cierre de sesión del portal por el SSO de IAM, y la persona con sesión.
  - name: Usuarios
    description: Personas de IAM. Consulta con el permiso `iam:usuarios.leer`.
  - name: Aplicaciones
    description: Sistemas registrados en IAM, con sus permisos y roles. Consulta con el permiso `iam:aplicaciones.leer`.
  - name: Clientes
    description: Clientes OAuth, con sus redirecciones y roles. Consulta con el permiso `iam:clientes.leer`. Nunca exponen el secreto.
  - name: Auditoria
    description: Registro de las acciones de administración de IAM. Consulta con el permiso `iam:auditoria.leer`.
  - name: Salud
    description: Estado del servicio.

paths:
  /api/iam/v1/auth/login:
    get:
      tags: [Acceso]
      summary: Iniciar sesión (navegación del navegador)
      description: |
        Redirige al login central de IAM (Authorization Code con PKCE `S256`, cliente del portal). Es una
        navegación completa, no una llamada de `HttpClient`. Al terminar, la persona vuelve a `redirect` (solo
        rutas de este origen) o a la página inicial.
      operationId: iniciarSesion
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Ruta del portal a la que volver después del login (por ejemplo `/usuarios`).
          schema: { type: string }
      responses:
        '302':
          description: Redirección a `/api/auth/oauth/authorize` de IAM.

  /api/iam/v1/auth/callback:
    get:
      tags: [Acceso]
      summary: Fin del inicio de sesión (lo llama IAM)
      description: |
        IAM vuelve aquí con `code` y `state`. API-IAM canjea el código en el servidor, abre la sesión y
        redirige a la ruta pedida. Si el login falla, redirige a la página inicial con `error_login`:

        | `error_login` | Cuándo |
        |---|---|
        | `SIN_ACCESO` | La persona no tiene roles en `iam-admin` o IAM no autorizó el login |
        | `LOGIN_INVALIDO` | El login no se inició en ese navegador, venció o IAM rechazó el código |
        | `IAM_NO_DISPONIBLE` | IAM no respondió |
      operationId: finInicioSesion
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: A la ruta pedida con la cookie de sesión, o a la página inicial con `error_login`.

  /api/iam/v1/auth/logout:
    post:
      tags: [Acceso]
      summary: Cerrar sesión (formulario del navegador)
      description: |
        Revoca en IAM el token de la sesión, cierra la sesión local y redirige al logout central de IAM, que
        vuelve al portal. Se envía como formulario `POST` con el campo `_token` (el `csrf` de `/me`), no con
        `HttpClient`. Con `scope=local` cierra solo la sesión del portal.
      operationId: cerrarSesion
      security:
        - sesionPortal: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [_token]
              properties:
                _token:
                  type: string
                  description: Token CSRF (`csrf` de `/me`).
                scope:
                  type: string
                  enum: [local]
      responses:
        '302':
          description: Redirección a `/api/auth/logout` de IAM.
        '419':
          description: Falta el token CSRF o no es válido.

  /api/iam/v1/me:
    get:
      tags: [Acceso]
      summary: Persona con sesión
      description: Quién es la persona y qué permisos `iam:*` tiene. Angular arma su menú con `permisos`.
      operationId: me
      security:
        - sesionPortal: []
      responses:
        '200':
          description: La persona con sesión.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uuid, nombre, correo, roles, permisos, csrf]
                    properties:
                      uuid:
                        type: string
                        format: uuid
                        description: Identificador público de la persona, en minúsculas.
                      nombre:
                        type: [string, 'null']
                      correo:
                        type: [string, 'null']
                        format: email
                      roles:
                        type: array
                        items: { type: string }
                        example: [administrador]
                      permisos:
                        type: array
                        items: { type: string }
                        example: ['iam:usuarios.leer', 'iam:usuarios.administrar']
                      csrf:
                        type: string
                        description: Token CSRF para el formulario de logout.
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/iam/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: |
        Personas de IAM ordenadas por nombre, paginadas. `buscar` filtra por nombre o correo que contengan el texto
        (sin distinguir mayúsculas, sí tildes) y, si el texto es un RUT válido con o sin puntos, por ese RUT.
        Nunca incluye contraseñas, `entra_oid` ni ids internos.
      operationId: listarUsuarios
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre o del correo, o un RUT (`12.345.678-5`, `12345678-5` o `123456785`).
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [activos, baja, todos], default: todos }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de personas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UsuarioResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Usuarios]
      summary: Dar de alta una persona
      description: |
        Crea la persona sin roles, con el correo en minúsculas y sin espacios y el RUT normalizado (`12345678-K`). Con
        `acceso` `microsoft` queda sin clave: API-Auth la vincula por correo en su primer login con Microsoft, así que el
        correo debe ser el de su cuenta Microsoft. Con `clave` se genera una clave temporal que vence a las
        `IAM_CLAVE_TEMPORAL_HORAS` horas y que API-Auth obliga a cambiar en el primer ingreso: va **solo en esta
        respuesta** (`Cache-Control: no-store`) y nunca en logs ni en la auditoría. Queda en la auditoría como
        `usuario.creacion` con `{nombre, correo, rut, acceso}`. Exige `iam:usuarios.administrar`.
      operationId: crearUsuario
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, acceso]
              properties:
                nombre: { type: string, maxLength: 255, example: Ana Pérez }
                correo: { type: string, format: email, maxLength: 255, example: ana.perez@ubo.cl }
                rut:
                  type: [string, 'null']
                  description: Opcional, con o sin puntos; se valida el dígito verificador (módulo 11).
                  example: 12.345.678-5
                acceso:
                  type: string
                  enum: [microsoft, clave]
                  description: '`microsoft` (sin clave) o `clave` (clave temporal).'
      responses:
        '201':
          description: Persona creada. La clave temporal, si la hay, no se vuelve a mostrar.
          headers:
            Cache-Control:
              description: '`no-store`: ni el navegador ni un proxy guardan la respuesta.'
              schema: { type: string, example: 'no-store, private' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaCreada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '409':
          description: Otra persona ya usa ese correo, sin distinguir mayúsculas (`CORREO_EN_USO`), o ese RUT (`RUT_EN_USO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              examples:
                correo:
                  value:
                    type: about:blank
                    title: Correo en uso
                    status: 409
                    detail: Otra persona ya usa ese correo.
                    error: CORREO_EN_USO
                rut:
                  value:
                    type: about:blank
                    title: RUT en uso
                    status: 409
                    detail: Otra persona ya usa ese RUT.
                    error: RUT_EN_USO
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/usuarios/{uuid}:
    get:
      tags: [Usuarios]
      summary: Ver un usuario
      description: Datos de cuenta de la persona y sus roles agrupados por aplicación (ambos ordenados por nombre).
      operationId: verUsuario
      security:
        - sesionPortal: []
      parameters:
        - name: uuid
          in: path
          required: true
          description: Identificador público de la persona (sin distinguir mayúsculas).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La persona.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe una persona con ese `uuid`, o no tiene formato de UUID (`USUARIO_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Usuario no encontrado
                status: 404
                detail: No existe una persona con ese identificador.
                error: USUARIO_NO_ENCONTRADO

  /api/iam/v1/usuarios/{uuid}/roles:
    post:
      tags: [Usuarios]
      summary: Asignar un rol a una persona
      description: |
        Asigna el rol y lo registra en la auditoría (`usuario.rol.asignacion`). No cierra las sesiones: el rol rige
        cuando la persona renueva su token. Los roles de `iam-admin` exigen todos los permisos de `iam-admin`; nadie
        cambia sus propios roles. Cada rechazo queda en la auditoría.
      operationId: asignarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aplicacion, rol]
              properties:
                aplicacion: { type: string, maxLength: 100, example: pago-honorarios }
                rol: { type: string, maxLength: 100, example: revisor }
      responses:
        '201':
          description: Rol asignado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
        '200':
          description: La persona ya tenía el rol; no cambió nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoDeRoles' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/usuarios/{uuid}/roles/{aplicacion}/{rol}:
    delete:
      tags: [Usuarios]
      summary: Quitar un rol a una persona
      description: |
        Quita el rol, lo registra en la auditoría (`usuario.rol.retiro`) y después pide a API-Auth cerrar las sesiones
        de la persona. Si API-Auth falla, el rol queda quitado y `sesiones_revocadas` es `false`: se reintenta con
        `POST /usuarios/{uuid}/sesiones/revocar`.
      operationId: quitarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - name: aplicacion
          in: path
          required: true
          schema: { type: string, example: pago-honorarios }
        - name: rol
          in: path
          required: true
          schema: { type: string, example: revisor }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Rol quitado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sesiones_revocadas]
                    properties:
                      sesiones_revocadas:
                        type: boolean
                        description: API-Auth confirmó el cierre de las sesiones de la persona.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoDeRoles' }
        '404':
          description: No existe la persona (`USUARIO_NO_ENCONTRADO`) o no tiene ese rol (`ROL_NO_ASIGNADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Rol no asignado
                status: 404
                detail: La persona no tiene ese rol.
                error: ROL_NO_ASIGNADO
        '409':
          description: Es la última persona activa con `iam-admin/administrador` (`ULTIMO_ADMINISTRADOR`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Último administrador
                status: 409
                detail: 'Es la última persona activa con iam-admin/administrador: asigne el rol a otra persona antes de quitárselo.'
                error: ULTIMO_ADMINISTRADOR
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/usuarios/{uuid}/sesiones/revocar:
    post:
      tags: [Usuarios]
      summary: Cerrar las sesiones de una persona
      description: |
        Pide a API-Auth cerrar todas las sesiones de la persona; es el reintento cuando un retiro de rol respondió
        `sesiones_revocadas` `false`. Se audita (`usuario.sesiones.revocacion`) solo si API-Auth lo confirma.
      operationId: revocarSesiones
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: API-Auth cerró las sesiones.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoDeRoles' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }
        '502':
          description: API-Auth no confirmó el cierre (`REVOCACION_FALLIDA`); se puede reintentar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Revocación fallida
                status: 502
                detail: IAM no confirmó el cierre de las sesiones. Intente de nuevo en unos minutos.
                error: REVOCACION_FALLIDA

  /api/iam/v1/usuarios/{uuid}/baja:
    post:
      tags: [Usuarios]
      summary: Dar de baja a una persona
      description: |
        Pone `disabled_at` (la persona conserva sus roles), lo registra en la auditoría (`usuario.baja`,
        `{"activo": true}` → `{"activo": false}`) y después pide a API-Auth cerrar sus sesiones; API-Auth ya no le
        emite tokens. Si API-Auth falla, la baja queda guardada y `sesiones_revocadas` es `false`: se reintenta con
        `POST /usuarios/{uuid}/sesiones/revocar`. Si ya estaba de baja, responde 200 con `sesiones_revocadas` `null`
        sin cambiar ni auditar nada.
      operationId: darDeBaja
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Persona de baja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sesiones_revocadas]
                    properties:
                      sesiones_revocadas:
                        type: [boolean, 'null']
                        description: API-Auth confirmó el cierre de las sesiones; `null` si la persona ya estaba de baja.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoSobrePersona' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '409':
          description: Es la última persona activa con `iam-admin/administrador` (`ULTIMO_ADMINISTRADOR`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Último administrador
                status: 409
                detail: 'Es la última persona activa con iam-admin/administrador: asigne el rol a otra persona antes de darla de baja.'
                error: ULTIMO_ADMINISTRADOR
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/usuarios/{uuid}/reactivacion:
    post:
      tags: [Usuarios]
      summary: Reactivar a una persona
      description: |
        Quita `disabled_at` (la persona conserva sus roles) y lo registra en la auditoría como `usuario.alta`
        (`{"activo": false}` → `{"activo": true}`). Si ya estaba activa, responde 200 sin cambiar ni auditar nada.
      operationId: reactivar
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Persona activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activo]
                    properties:
                      activo: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoSobrePersona' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/usuarios/{uuid}/clave:
    post:
      tags: [Usuarios]
      summary: Reiniciar la clave de una persona
      description: |
        Genera una clave temporal nueva que vence a las `IAM_CLAVE_TEMPORAL_HORAS` horas, guarda solo su hash, lo
        registra en la auditoría (`usuario.clave.reinicio`, sin valores) y después pide a API-Auth cerrar las
        sesiones de la persona. La clave se muestra **una sola vez** (`Cache-Control: no-store`) y API-Auth obliga a
        cambiarla en el primer ingreso. A una persona que solo entraba con Microsoft le da además una clave.
      operationId: reiniciarClave
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Clave reiniciada.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaveReiniciada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoSobrePersona' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones:
    get:
      tags: [Aplicaciones]
      summary: Listar aplicaciones
      description: |
        Aplicaciones de IAM ordenadas por nombre, paginadas, con la cantidad de permisos y roles de cada una.
        `buscar` filtra por nombre o descripción que contengan el texto (sin distinguir mayúsculas).
        Nunca incluye ids internos.
      operationId: listarAplicaciones
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre o de la descripción.
          schema: { type: string, maxLength: 100 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de aplicaciones.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AplicacionResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/aplicaciones/{nombre}:
    get:
      tags: [Aplicaciones]
      summary: Ver una aplicación
      description: La aplicación con sus permisos y sus roles, y los permisos que da cada rol (todo ordenado por nombre).
      operationId: verAplicacion
      security:
        - sesionPortal: []
      parameters:
        - name: nombre
          in: path
          required: true
          description: Nombre de la aplicación (sin distinguir mayúsculas).
          schema: { type: string, example: iam-admin }
      responses:
        '200':
          description: La aplicación.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AplicacionDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe una aplicación con ese nombre (`APLICACION_NO_ENCONTRADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Aplicación no encontrada
                status: 404
                detail: No existe una aplicación con ese nombre.
                error: APLICACION_NO_ENCONTRADA

  /api/iam/v1/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes OAuth
      description: |
        Clientes OAuth ordenados por nombre (y luego por id), paginados, con su aplicación, si están revocados y
        cuántos roles tienen. Incluye los revocados. `buscar` filtra por el nombre del cliente o de su aplicación
        (sin distinguir mayúsculas); si es un UUID, trae además el cliente con ese id. Nunca incluye el secreto.
      operationId: listarClientes
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre del cliente o de su aplicación, o el id completo.
          schema: { type: string, maxLength: 100 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de clientes.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClienteResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Clientes]
      summary: Crear un cliente OAuth
      description: |
        Crea un cliente confidencial de una aplicación, sin roles. `authorization-code` (login de personas) recibe las
        concesiones `authorization_code` y `refresh_token` y necesita al menos una redirección; `client-credentials`
        (servicio a servicio) recibe `client_credentials` y no lleva redirecciones. Cada redirección debe ser una URL
        absoluta `https` (o `http` en `localhost`), sin fragmento. El nombre no puede repetirse entre los clientes, sin
        distinguir mayúsculas. Los clientes de `iam-admin` solo los crea `iam:install`.

        El secreto va **solo en esta respuesta** (`Cache-Control: no-store`); se guarda solo su hash y nunca queda en
        logs ni en la auditoría, donde la creación queda como `cliente.creacion` con
        `{nombre, aplicacion, tipo, redirecciones}`. Exige `iam:clientes.administrar`.
      operationId: crearCliente
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, aplicacion, tipo]
              properties:
                nombre: { type: string, maxLength: 100, example: satelite-web }
                aplicacion:
                  type: string
                  description: Nombre de una aplicación existente, distinta de `iam-admin`.
                  example: satelite
                tipo:
                  type: string
                  enum: [authorization-code, client-credentials]
                redirecciones:
                  type: [array, 'null']
                  description: Obligatorias con `authorization-code`; prohibidas con `client-credentials`.
                  items: { type: string, format: uri, example: 'https://satelite.ubo.cl/auth/callback' }
      responses:
        '201':
          description: Cliente creado. El secreto no se vuelve a mostrar.
          headers:
            Cache-Control:
              description: '`no-store`: ni el navegador ni un proxy guardan la respuesta.'
              schema: { type: string, example: 'no-store, private' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteCreado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '409':
          description: Otro cliente ya usa ese nombre, sin distinguir mayúsculas (`CLIENTE_EXISTENTE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente existente
                status: 409
                detail: Ya existe un cliente con ese nombre.
                error: CLIENTE_EXISTENTE
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/clientes/{id}:
    get:
      tags: [Clientes]
      summary: Ver un cliente OAuth
      description: |
        El cliente con sus concesiones, sus redirecciones, si es confidencial y sus roles (con la aplicación de cada
        rol, que puede ser distinta de la del cliente). Nunca incluye el secreto ni su hash.
      operationId: verCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
      responses:
        '200':
          description: El cliente.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ClienteDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente no encontrado
                status: 404
                detail: No existe un cliente con ese id.
                error: CLIENTE_NO_ENCONTRADO

  /api/iam/v1/clientes/{id}/secreto:
    post:
      tags: [Clientes]
      summary: Rotar el secreto de un cliente OAuth
      description: |
        Genera un secreto nuevo de 40 caracteres para un cliente confidencial, guarda solo su hash bcrypt y lo
        registra en la auditoría (`cliente.secreto.rotacion`, sin el secreto ni su hash). El secreto anterior deja de
        servir de inmediato (los tokens ya emitidos siguen válidos hasta vencer). El secreto se muestra **una sola
        vez** (`Cache-Control: no-store`). Los clientes de `iam-admin` (`iam-admin-portal`, `iam-admin-sistema`)
        exigen `confirmar` con el nombre del cliente: rotarlos corta el login del portal o la revocación de sesiones
        hasta actualizar el `.env` de API-IAM con la variable que indica `variable_env`. Exige
        `iam:clientes.administrar`.
      operationId: rotarSecretoCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmar:
                  type: [string, 'null']
                  maxLength: 255
                  description: El nombre del cliente. Obligatorio solo para los clientes de `iam-admin`.
                  example: iam-admin-portal
      responses:
        '200':
          description: Secreto rotado. No se vuelve a mostrar.
          headers:
            Cache-Control:
              description: '`no-store`: ni el navegador ni un proxy guardan la respuesta.'
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretoRotado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: El cliente es público (PKCE, sin secreto) y no recibe uno (`CLIENTE_PUBLICO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente público
                status: 409
                detail: 'El cliente es público (PKCE): no tiene secreto que rotar.'
                error: CLIENTE_PUBLICO
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/clientes/{id}/revocacion:
    post:
      tags: [Clientes]
      summary: Revocar un cliente OAuth
      description: |
        Marca el cliente como revocado y lo registra en la auditoría (`cliente.revocacion`, `{"revocado": false}` →
        `{"revocado": true}`). API-Auth deja de emitir y renovar sus tokens y sus rutas los rechazan; con el cambio
        `introspeccion-cliente-revocado` de API-Auth, la introspección también reporta inactivos los tokens
        vigentes (sin él, siguen aceptados por las APIs que introspectan hasta vencer). Si ya estaba revocado,
        responde 200 sin cambiar nada ni auditar. Los clientes de `iam-admin` no se revocan: el intento responde 409
        y queda en la auditoría como `rechazado`. Exige `iam:clientes.administrar`.
      operationId: revocarCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: El cliente está revocado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeRevocacion' }
              example: { data: { revocado: true } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: El cliente es de `iam-admin`, que usa la propia API-IAM, y no se revoca (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente de iam-admin
                status: 409
                detail: 'El cliente es de iam-admin: API-IAM lo usa y no se cambia desde el portal.'
                error: CLIENTE_DE_IAM_ADMIN
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/clientes/{id}/reactivacion:
    post:
      tags: [Clientes]
      summary: Reactivar un cliente OAuth
      description: |
        Quita la marca de revocado y lo registra en la auditoría (`cliente.reactivacion`, `{"revocado": true}` →
        `{"revocado": false}`). Los tokens del cliente que no vencieron vuelven a valer: si se revocó por un secreto
        filtrado, rote el secreto antes de reactivar. Si ya estaba activo, responde 200 sin cambiar nada ni
        auditar. Los clientes de `iam-admin` sí se reactivan. Exige `iam:clientes.administrar`.
      operationId: reactivarCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: El cliente está activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeRevocacion' }
              example: { data: { revocado: false } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/clientes/{id}/roles:
    post:
      tags: [Clientes]
      summary: Asignar un rol a un cliente de servicio
      description: |
        Asigna a un cliente `client-credentials` un rol de cualquier aplicación y lo registra en la auditoría
        (`cliente.rol.asignacion`, `despues` `{"rol": "<aplicacion>/<rol>"}`). Sus tokens `client_credentials` llevan
        los scopes del rol desde el siguiente token. Si ya lo tenía, responde 200 sin cambiar nada ni auditar.
        Los clientes de login (`CLIENTE_SIN_ROLES`), los roles de `iam-admin` (`ROL_DE_IAM_ADMIN`) y los clientes
        de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`) responden 409 y el intento queda en la auditoría como `rechazado`.
        Exige `iam:clientes.administrar`.
      operationId: asignarRolACliente
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aplicacion, rol]
              properties:
                aplicacion: { type: string, maxLength: 100, example: api-maestros }
                rol: { type: string, maxLength: 100, example: maestros-lector }
      responses:
        '201':
          description: Rol asignado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
              example: { data: { asignado: true } }
        '200':
          description: El cliente ya tenía el rol; no cambió nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
              example: { data: { asignado: false } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/ClienteNoEncontrado' }
        '409':
          description: |
            El cliente es de login (`CLIENTE_SIN_ROLES`), el rol es de `iam-admin` (`ROL_DE_IAM_ADMIN`) o el cliente
            es de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Rol de iam-admin
                status: 409
                detail: Los roles de iam-admin no se asignan a clientes.
                error: ROL_DE_IAM_ADMIN
        '419': { $ref: '#/components/responses/Csrf' }
        '422':
          description: Faltan `aplicacion` o `rol`, o no existe ese rol en esa aplicación (`VALIDACION`, mensaje en `errores.rol`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaValidacion' }

  /api/iam/v1/clientes/{id}/roles/{aplicacion}/{rol}:
    delete:
      tags: [Clientes]
      summary: Quitar un rol a un cliente de servicio
      description: |
        Quita el rol y lo registra en la auditoría (`cliente.rol.retiro`, `antes` `{"rol": "<aplicacion>/<rol>"}`).
        Los tokens ya emitidos conservan sus scopes hasta vencer (máximo 60 minutos): el cambio rige en el siguiente
        token; si es urgente, revoque el cliente. Los clientes de login (`CLIENTE_SIN_ROLES`) y los de `iam-admin`
        (`CLIENTE_DE_IAM_ADMIN`) responden 409 y el intento queda en la auditoría como `rechazado`. Exige
        `iam:clientes.administrar`.
      operationId: quitarRolACliente
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - name: aplicacion
          in: path
          required: true
          schema: { type: string, example: api-maestros }
        - name: rol
          in: path
          required: true
          schema: { type: string, example: maestros-lector }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Rol quitado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [quitado]
                    properties:
                      quitado: { type: boolean, const: true }
              example: { data: { quitado: true } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe el cliente (`CLIENTE_NO_ENCONTRADO`) o no tiene ese rol (`ROL_NO_ASIGNADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Rol no asignado
                status: 404
                detail: El cliente no tiene ese rol.
                error: ROL_NO_ASIGNADO
        '409':
          description: El cliente es de login (`CLIENTE_SIN_ROLES`) o de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente sin roles
                status: 409
                detail: 'El cliente no es de servicio: sus tokens llevan los roles de la persona, no los del cliente.'
                error: CLIENTE_SIN_ROLES
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/clientes/{id}/redirecciones:
    put:
      tags: [Clientes]
      summary: Cambiar las redirecciones de un cliente de login
      description: |
        Reemplaza las redirecciones de un cliente `authorization-code` por la lista recibida (en ese orden, sin
        duplicados) y lo registra en la auditoría (`cliente.redirecciones.cambio`, con la lista anterior en `antes`
        y la nueva en `despues`). Si son las mismas, aunque en otro orden, responde 200 sin cambiar nada ni auditar.
        Exige al menos una, cada una `https` (o `http` en `localhost`) y sin fragmento. Los clientes de servicio
        (`CLIENTE_SIN_REDIRECCIONES`) y los de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`) responden 409 y el intento queda
        en la auditoría como `rechazado`. Exige `iam:clientes.administrar`.
      operationId: cambiarRedirecciones
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirecciones]
              properties:
                redirecciones:
                  type: array
                  minItems: 1
                  items: { type: string, format: uri, maxLength: 2000 }
                  example: ['https://satelite.ubo.cl/auth/callback', 'https://satelite-qa.ubo.cl/auth/callback']
      responses:
        '200':
          description: Las redirecciones del cliente después del cambio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [redirecciones]
                    properties:
                      redirecciones:
                        type: array
                        items: { type: string, format: uri }
              example: { data: { redirecciones: ['https://satelite.ubo.cl/auth/callback', 'https://satelite-qa.ubo.cl/auth/callback'] } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/ClienteNoEncontrado' }
        '409':
          description: El cliente es de servicio (`CLIENTE_SIN_REDIRECCIONES`) o de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente sin redirecciones
                status: 409
                detail: 'El cliente no es de login: no usa redirecciones.'
                error: CLIENTE_SIN_REDIRECCIONES
        '419': { $ref: '#/components/responses/Csrf' }
        '422':
          description: |
            Lista vacía (mensaje en `errores.redirecciones`) o una redirección insegura (mensaje en
            `errores["redirecciones.<n>"]`) (`VALIDACION`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaValidacion' }

  /api/iam/v1/auditoria:
    get:
      tags: [Auditoria]
      summary: Consultar la auditoría
      description: |
        Entradas del registro de auditoría, de la más reciente a la más antigua, paginadas. Los filtros se combinan.
        El nombre y el correo del actor vienen de Usuarios mientras la persona exista. Consultar la auditoría no
        escribe en la base.
      operationId: listarAuditoria
      security:
        - sesionPortal: []
      parameters:
        - name: desde
          in: query
          required: false
          description: Primer día incluido (zona de la aplicación).
          schema: { type: string, format: date, example: '2026-11-09' }
        - name: hasta
          in: query
          required: false
          description: Último día incluido (zona de la aplicación); no puede ser anterior a `desde`.
          schema: { type: string, format: date, example: '2026-11-10' }
        - name: actor
          in: query
          required: false
          description: '`uuid` de la persona que hizo la acción.'
          schema: { type: string, format: uuid }
        - name: accion
          in: query
          required: false
          description: Prefijo del código de acción, por ejemplo `cliente.`.
          schema: { type: string, maxLength: 100 }
        - name: entidad_tipo
          in: query
          required: false
          schema: { type: string, maxLength: 50, example: cliente }
        - name: entidad_id
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: resultado
          in: query
          required: false
          schema: { type: string, enum: [ok, rechazado] }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de entradas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EntradaAuditoria' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/salud:
    get:
      tags: [Salud]
      summary: Estado de la API y de la base de datos
      description: |
        Ejecuta una consulta trivial en la base de datos `IAM`. Lo usa el healthcheck de nginx en
        `docker-compose.prod.yml`. Misma forma que en las demás APIs de la UBO (módulo Health de UBO.Common).
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [OK] }
                  base_datos: { type: string, enum: [OK] }
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [ERROR] }
                  base_datos: { type: string, enum: [NO_DISPONIBLE] }

components:
  securitySchemes:
    sesionPortal:
      type: apiKey
      in: cookie
      name: api-iam-session
      description: Cookie de sesión del portal, que se obtiene con el login. Su nombre real es el de `SESSION_COOKIE`.

  parameters:
    UuidPersona:
      name: uuid
      in: path
      required: true
      description: Identificador público de la persona (sin distinguir mayúsculas).
      schema: { type: string, format: uuid }
    IdCliente:
      name: id
      in: path
      required: true
      description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
      schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token CSRF, tomado de la cookie `XSRF-TOKEN` (Angular lo envía solo).
      schema: { type: string }

  schemas:
    Problema:
      type: object
      description: Error en formato RFC 9457 (`application/problem+json`).
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, const: about:blank }
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de este caso en particular.
        error:
          type: string
          description: Código estable para el programa que llama (ver la descripción de la API).

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            error: { const: VALIDACION }
            errores:
              type: object
              description: Mensajes de error por campo.
              additionalProperties:
                type: array
                items: { type: string }

    MetaPaginacion:
      type: object
      description: Paginación de una lista (`meta` de las respuestas que listan).
      required: [total, pagina, por_pagina]
      properties:
        total:
          type: integer
          description: Cantidad total de elementos que cumplen el filtro.
        pagina:
          type: integer
          minimum: 1
          description: Página devuelta.
        por_pagina:
          type: integer
          minimum: 1
          description: Elementos por página.

    UsuarioResumen:
      type: object
      required: [uuid, nombre, correo, rut, estado]
      properties:
        uuid:
          type: string
          format: uuid
          description: Identificador público de la persona, en minúsculas.
        nombre: { type: string, example: Ana Pérez }
        correo: { type: string, format: email, example: ana@ubo.cl }
        rut:
          type: [string, 'null']
          description: RUT normalizado (sin puntos, con guion y `K` mayúscula).
          example: 12345678-5
        estado:
          type: string
          enum: [activo, baja]

    UsuarioDetalle:
      allOf:
        - $ref: '#/components/schemas/UsuarioResumen'
        - type: object
          required: [baja_desde, tiene_clave, microsoft_vinculado, clave_temporal_vence, creado, actualizado, aplicaciones]
          properties:
            baja_desde:
              type: [string, 'null']
              format: date-time
              description: Desde cuándo está dada de baja.
            tiene_clave:
              type: boolean
              description: Tiene contraseña de IAM (sin revelarla).
            microsoft_vinculado:
              type: boolean
              description: Ya entró con su cuenta Microsoft.
            clave_temporal_vence:
              type: [string, 'null']
              format: date-time
              description: Vencimiento de la clave temporal, si la tiene.
            creado: { type: [string, 'null'], format: date-time }
            actualizado: { type: [string, 'null'], format: date-time }
            aplicaciones:
              type: array
              description: Aplicaciones donde la persona tiene roles.
              items:
                type: object
                required: [nombre, descripcion, roles]
                properties:
                  nombre: { type: string, example: iam-admin }
                  descripcion: { type: [string, 'null'] }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [nombre, descripcion]
                      properties:
                        nombre: { type: string, example: administrador }
                        descripcion: { type: [string, 'null'] }

    AplicacionResumen:
      type: object
      required: [nombre, descripcion, permisos, roles]
      properties:
        nombre:
          type: string
          description: Nombre único de la aplicación; la identifica en la URL.
          example: iam-admin
        descripcion: { type: [string, 'null'], example: Portal de administración de IAM }
        permisos:
          type: integer
          description: Cantidad de permisos que define.
          example: 7
        roles:
          type: integer
          description: Cantidad de roles que define.
          example: 2

    AplicacionDetalle:
      type: object
      required: [nombre, descripcion, creada, actualizada, permisos, roles]
      properties:
        nombre: { type: string, example: iam-admin }
        descripcion: { type: [string, 'null'] }
        creada: { type: [string, 'null'], format: date-time }
        actualizada: { type: [string, 'null'], format: date-time }
        permisos:
          type: array
          description: Permisos de la aplicación, ordenados por nombre.
          items:
            type: object
            required: [nombre, descripcion]
            properties:
              nombre: { type: string, example: 'iam:usuarios.leer' }
              descripcion: { type: string, example: Ver usuarios y sus roles }
        roles:
          type: array
          description: Roles de la aplicación, ordenados por nombre.
          items:
            type: object
            required: [nombre, descripcion, permisos]
            properties:
              nombre: { type: string, example: mesa-de-ayuda }
              descripcion: { type: [string, 'null'] }
              permisos:
                type: array
                description: Nombres de los permisos que da el rol, ordenados.
                items: { type: string }
                example: ['iam:aplicaciones.leer', 'iam:usuarios.administrar', 'iam:usuarios.leer']

    ClienteResumen:
      type: object
      required: [id, nombre, aplicacion, revocado, roles]
      properties:
        id:
          type: string
          format: uuid
          description: El `client_id` OAuth, en minúsculas; identifica al cliente en la URL.
        nombre: { type: string, example: iam-admin-portal }
        aplicacion:
          type: string
          description: Nombre de la aplicación a la que pertenece.
          example: iam-admin
        revocado: { type: boolean }
        roles:
          type: integer
          description: Cantidad de roles asignados.
          example: 0

    ClienteDetalle:
      type: object
      required: [id, nombre, aplicacion, concesiones, confidencial, redirecciones, revocado, creado, actualizado, roles]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: iam-admin-sistema }
        aplicacion: { type: string, example: iam-admin }
        concesiones:
          type: array
          description: Tipos de concesión OAuth (`grant_types`) que puede usar.
          items: { type: string }
          example: [client_credentials]
        confidencial:
          type: boolean
          description: Tiene secreto (sin revelarlo).
        redirecciones:
          type: array
          description: Direcciones a las que puede volver tras el login (clientes authorization-code).
          items: { type: string, format: uri }
        revocado: { type: boolean }
        creado: { type: [string, 'null'], format: date-time }
        actualizado: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          description: Roles asignados, ordenados por aplicación y nombre.
          items:
            type: object
            required: [aplicacion, nombre, descripcion]
            properties:
              aplicacion:
                type: string
                description: Aplicación del rol; puede ser distinta de la del cliente.
                example: api-auth
              nombre: { type: string, example: introspector }
              descripcion: { type: [string, 'null'] }

    ResultadoAsignacion:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [asignado]
          properties:
            asignado:
              type: boolean
              description: '`true` si se asignó ahora; `false` si la persona o el cliente ya lo tenía.'

    PersonaCreada:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uuid, clave_temporal]
          properties:
            uuid: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-1b2c3d4e5f60 }
            clave_temporal:
              description: Solo con `acceso` `clave`; `null` con `microsoft`. Se muestra una sola vez.
              oneOf:
                - type: 'null'
                - type: object
                  required: [clave, vence]
                  properties:
                    clave: { type: string, pattern: '^[A-Za-z2-9]{4}-[A-Za-z2-9]{4}-[A-Za-z2-9]{4}$', example: Xk7m-P2qr-9Wzt }
                    vence: { type: string, format: date-time, example: '2026-11-13T12:00:00-03:00' }

    ClaveReiniciada:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [clave_temporal, sesiones_revocadas]
          properties:
            clave_temporal:
              description: Se muestra una sola vez.
              type: object
              required: [clave, vence]
              properties:
                clave: { type: string, pattern: '^[A-Za-z2-9]{4}-[A-Za-z2-9]{4}-[A-Za-z2-9]{4}$', example: Xk7m-P2qr-9Wzt }
                vence: { type: string, format: date-time, example: '2026-11-13T12:00:00-03:00' }
            sesiones_revocadas:
              type: boolean
              description: API-Auth confirmó el cierre de las sesiones; con `false` se reintenta con `POST /usuarios/{uuid}/sesiones/revocar`.

    ClienteCreado:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, secreto]
          properties:
            id: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
            secreto:
              type: string
              pattern: '^[A-Za-z0-9]{40}$'
              description: Se muestra una sola vez.
              example: 7fQx2Lm9Rk4Tz8Wb1Nc6Vd3Hj5Ps0Ya2Ge7Ku9Mi

    SecretoRotado:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [secreto, variable_env]
          properties:
            secreto:
              type: string
              pattern: '^[A-Za-z0-9]{40}$'
              description: Se muestra una sola vez.
              example: 7fQx2Lm9Rk4Tz8Wb1Nc6Vd3Hj5Ps0Ya2Ge7Ku9Mi
            variable_env:
              type: [string, 'null']
              enum: [UBO_LOGIN_CLIENT_SECRET, UBO_AUTH_CLIENT_SECRET, null]
              description: La variable del `.env` de API-IAM que hay que actualizar (clientes de `iam-admin`); `null` para los demás.

    EstadoDeRevocacion:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [revocado]
          properties:
            revocado:
              type: boolean
              description: El estado del cliente tras la acción.

    EntradaAuditoria:
      type: object
      required: [ocurrido_en, actor, accion, entidad, resultado, motivo, antes, despues, trace_id]
      properties:
        ocurrido_en: { type: string, format: date-time }
        actor:
          type: object
          required: [tipo, uuid, nombre, correo]
          properties:
            tipo: { type: string, enum: [persona, comando] }
            uuid: { type: [string, 'null'], format: uuid }
            nombre:
              type: [string, 'null']
              description: Nombre de la persona, si existe en IAM.
            correo: { type: [string, 'null'], format: email }
        accion:
          type: string
          description: Código estable de la acción.
          example: cliente.secreto.rotacion
        entidad:
          type: object
          required: [tipo, id, nombre]
          properties:
            tipo: { type: string, example: rol }
            id:
              type: string
              description: Identificador guardado (`uuid` para usuario y cliente; id numérico para aplicación, rol y permiso).
              example: '16'
            nombre:
              type: [string, 'null']
              description: |
                Nombre actual de la entidad (el rol como `aplicacion/rol`); `null` si ya no existe o su tipo no
                tiene nombre conocido.
              example: iam-admin/mesa-de-ayuda
        resultado: { type: string, enum: [ok, rechazado] }
        motivo:
          type: [string, 'null']
          description: Código del motivo de un intento rechazado.
          example: ESCALAMIENTO_DE_PRIVILEGIOS
        antes:
          type: [object, 'null']
          description: Campos auditables antes de la acción. Nunca contiene secretos.
        despues:
          type: [object, 'null']
          description: Campos auditables después de la acción. Nunca contiene secretos.
          example: { rol: iam-admin/administrador }
        trace_id:
          type: [string, 'null']
          description: '`trace_id` de la petición o del comando.'

  responses:
    NoAutenticado:
      description: No hay sesión del portal (`NO_AUTENTICADO`). Angular debe navegar a `/api/iam/v1/auth/login`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Se requiere un token de acceso válido, vigente y no revocado.
            error: NO_AUTENTICADO
    AccesoDenegado:
      description: La persona no tiene el permiso `iam:*` que exige la ruta (`ACCESO_DENEGADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    RechazoDeRoles:
      description: |
        Sin el permiso de la ruta (`ACCESO_DENEGADO`), un rol de `iam-admin` sin todos los permisos de `iam-admin`
        (`ESCALAMIENTO_DE_PRIVILEGIOS`) o una acción sobre uno mismo (`ACCION_SOBRE_SI_MISMO`). Los dos últimos quedan
        en la auditoría como `rechazado`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Escalamiento de privilegios
            status: 403
            detail: Para asignar o quitar roles de iam-admin necesita todos los permisos de iam-admin.
            error: ESCALAMIENTO_DE_PRIVILEGIOS
    RechazoSobrePersona:
      description: |
        Sin el permiso de la ruta (`ACCESO_DENEGADO`), una persona con roles de `iam-admin` sin todos los permisos de
        `iam-admin` (`ESCALAMIENTO_DE_PRIVILEGIOS`) o una acción sobre uno mismo (`ACCION_SOBRE_SI_MISMO`). Los dos
        últimos quedan en la auditoría como `rechazado`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Escalamiento de privilegios
            status: 403
            detail: Para actuar sobre una persona con roles de iam-admin necesita todos los permisos de iam-admin.
            error: ESCALAMIENTO_DE_PRIVILEGIOS
    UsuarioNoEncontrado:
      description: No existe una persona con ese `uuid`, o no tiene formato de UUID (`USUARIO_NO_ENCONTRADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ClienteNoEncontrado:
      description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Csrf:
      description: Falta el token CSRF (header `X-XSRF-TOKEN`) o no es válido.
    Validacion:
      description: Datos inválidos (`VALIDACION`), con los mensajes por campo en `errores`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
    ErrorInterno:
      description: Error inesperado (`ERROR_INTERNO`). El detalle queda solo en el log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Error interno
            status: 500
            detail: Ocurrió un error inesperado.
            error: ERROR_INTERNO
