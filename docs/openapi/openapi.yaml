openapi: 3.1.0
info:
  title: API-IAM
  version: 0.2.0
  description: |
    Backend de administración de IAM de la UBO: usuarios, aplicaciones (con sus roles y permisos),
    clientes OAuth y auditoría. Es dueño de los datos de identidad y acceso que usa API-Auth para emitir tokens.
    Lo consume el portal Angular de IAM como BFF (backend-for-frontend), en el mismo origen.

    Todas las rutas viven bajo `/api/iam`, y las de la versión 1 bajo `/api/iam/v1`.

    **Respuestas:** los datos van en `data` y la información adicional (como la paginación) en `meta`.

    **Sesión del portal (BFF):** Angular se sirve en el mismo origen y nunca ve un token. La persona entra por el
    SSO de IAM navegando a `/api/iam/v1/auth/login`; API-IAM guarda los tokens en el servidor y el navegador solo
    recibe la cookie de sesión. Las rutas del portal exigen esa sesión (`401 NO_AUTENTICADO` sin ella) y un permiso
    `iam:*` (`403` sin él). Las que cambian datos exigen además el token CSRF: Angular lo envía solo en el header
    `X-XSRF-TOKEN`, tomado de la cookie `XSRF-TOKEN` (`419` sin él).

    **Errores:** las rutas `/api/iam/*` responden los errores en RFC 9457 (`application/problem+json`)
    con un código estable en `error`, como las demás APIs de la UBO:

    | `error` | Estado | Cuándo |
    |---|---|---|
    | `NO_AUTENTICADO` | 401 | No hay sesión del portal |
    | `ACCESO_DENEGADO` | 403 | La persona no tiene el permiso `iam:*` que exige la ruta |
    | `VALIDACION` | 422 | Datos inválidos; los mensajes por campo van en `errores` |
    | `USUARIO_NO_ENCONTRADO` | 404 | No existe una persona con ese `uuid` |
    | `APLICACION_NO_ENCONTRADA` | 404 | No existe una aplicación con ese nombre |
    | `CLIENTE_NO_ENCONTRADO` | 404 | No existe un cliente OAuth con ese id |
    | `PERMISO_NO_ENCONTRADO` | 404 | La aplicación no tiene un permiso con ese nombre |
    | `ROL_NO_ENCONTRADO` | 404 | La aplicación no tiene un rol con ese nombre |
    | `ROL_NO_ASIGNADO` | 404 | La persona o el cliente no tiene ese rol |
    | `APLICACION_EXISTENTE` | 409 | Ya existe una aplicación con ese nombre |
    | `PERMISO_EXISTENTE` | 409 | Ya existe un permiso con ese nombre, en cualquier aplicación |
    | `ROL_EXISTENTE` | 409 | La aplicación ya tiene un rol con ese nombre (sin distinguir mayúsculas) |
    | `CATALOGO_DE_IAM_ADMIN` | 409 | Crear, editar, borrar o cambiar los permisos de algo de `iam-admin`, o dar un permiso de `iam-admin` a un rol de otra aplicación |
    | `EN_USO` | 409 | Borrar una aplicación, un permiso o un rol que está en uso; el `impacto` va en el problema |
    | `BAJA_SIN_CONFIRMAR` | 409 | Dar de baja una aplicación o un rol sin `confirmar_baja: true`; el `impacto` va en el problema |
    | `CLIENTE_DE_IAM_ADMIN` | 409 | Revocar un cliente de `iam-admin`, o cambiar sus roles o redirecciones |
    | `CLIENTE_SIN_ROLES` | 409 | Asignar o quitar roles a un cliente de login (`authorization-code`): sus tokens llevan los roles de la persona |
    | `ROL_DE_IAM_ADMIN` | 409 | Asignar a un cliente un rol de `iam-admin` |
    | `CLIENTE_SIN_REDIRECCIONES` | 409 | Cambiar las redirecciones de un cliente de servicio (`client-credentials`) |
    | `ESCALAMIENTO_DE_PRIVILEGIOS` | 403 | Asignar o quitar un rol de `iam-admin`, o dar de baja, reactivar o reiniciar la clave de una persona con roles de `iam-admin`, sin todos los permisos de `iam-admin` |
    | `ACCION_SOBRE_SI_MISMO` | 403 | Cambiar los propios roles, cerrar las propias sesiones, darse de baja o reiniciar la propia clave |
    | `ULTIMO_ADMINISTRADOR` | 409 | Quitar `iam-admin/administrador` a la última persona activa que lo tiene, o darla de baja |
    | `REVOCACION_FALLIDA` | 502 | API-Auth no confirmó el cierre de las sesiones; se puede reintentar |
    | `RUTA_NO_ENCONTRADA` / `METODO_NO_PERMITIDO` | 404 / 405 | La ruta o el método no existen |
    | `ERROR_INTERNO` | 500 | Error inesperado; el detalle queda solo en el log |

    Toda respuesta trae el header `X-Trace-Id` con el `trace_id` de la petición (UBO.Common, módulo Tracing).
    Si se envía un `traceparent` (W3C Trace Context), la traza continúa.
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Acceso
    description: Inicio y cierre de sesión del portal por el SSO de IAM, y la persona con sesión.
  - name: Usuarios
    description: Personas de IAM. Consulta con el permiso `iam:usuarios.leer`.
  - name: Aplicaciones
    description: |
      Sistemas registrados en IAM, con sus permisos y roles. Consulta con el permiso `iam:aplicaciones.leer`; crear y
      describir aplicaciones, permisos y roles, y fijar qué permisos da cada rol, con `iam:aplicaciones.administrar`.
      El catálogo de `iam-admin` no se cambia desde el portal. API-Auth aplica los cambios desde el siguiente token.
  - name: Clientes
    description: Clientes OAuth, con sus redirecciones y roles. Consulta con el permiso `iam:clientes.leer`. Nunca exponen el secreto.
  - name: Auditoria
    description: Registro de las acciones de administración de IAM. Consulta con el permiso `iam:auditoria.leer`.
  - name: Indicadores
    description: Indicadores del entorno IAM para el inicio del portal. Solo con sesión; cada bloque depende de un permiso de lectura.
  - name: Salud
    description: Estado del servicio.

paths:
  /api/iam/v1/auth/login:
    get:
      tags: [Acceso]
      summary: Iniciar sesión (navegación del navegador)
      description: |
        Redirige al login central de IAM (Authorization Code con PKCE `S256`, cliente del portal). Es una
        navegación completa, no una llamada de `HttpClient`. Al terminar, la persona vuelve a `redirect` (solo
        rutas de este origen) o a la página inicial.
      operationId: iniciarSesion
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Ruta del portal a la que volver después del login (por ejemplo `/usuarios`).
          schema: { type: string }
      responses:
        '302':
          description: Redirección a `/api/auth/oauth/authorize` de IAM.

  /api/iam/v1/auth/callback:
    get:
      tags: [Acceso]
      summary: Fin del inicio de sesión (lo llama IAM)
      description: |
        IAM vuelve aquí con `code` y `state`. API-IAM canjea el código en el servidor, abre la sesión y
        redirige a la ruta pedida. Si el login falla, redirige a la página inicial con `error_login`:

        | `error_login` | Cuándo |
        |---|---|
        | `SIN_ACCESO` | La persona no tiene roles en `iam-admin` o IAM no autorizó el login |
        | `LOGIN_INVALIDO` | El login no se inició en ese navegador, venció o IAM rechazó el código |
        | `IAM_NO_DISPONIBLE` | IAM no respondió |
      operationId: finInicioSesion
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: A la ruta pedida con la cookie de sesión, o a la página inicial con `error_login`.

  /api/iam/v1/auth/logout:
    post:
      tags: [Acceso]
      summary: Cerrar sesión (formulario del navegador)
      description: |
        Revoca en IAM el token de la sesión, cierra la sesión local y redirige al logout central de IAM, que
        vuelve al portal. Se envía como formulario `POST` con el campo `_token` (el `csrf` de `/me`), no con
        `HttpClient`. Con `scope=local` cierra solo la sesión del portal.
      operationId: cerrarSesion
      security:
        - sesionPortal: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [_token]
              properties:
                _token:
                  type: string
                  description: Token CSRF (`csrf` de `/me`).
                scope:
                  type: string
                  enum: [local]
      responses:
        '302':
          description: Redirección a `/api/auth/logout` de IAM.
        '419':
          description: Falta el token CSRF o no es válido.

  /api/iam/v1/me:
    get:
      tags: [Acceso]
      summary: Persona con sesión
      description: Quién es la persona y qué permisos `iam:*` tiene. Angular arma su menú con `permisos`.
      operationId: me
      security:
        - sesionPortal: []
      responses:
        '200':
          description: La persona con sesión.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uuid, nombre, correo, roles, permisos, csrf]
                    properties:
                      uuid:
                        type: string
                        format: uuid
                        description: Identificador público de la persona, en minúsculas.
                      nombre:
                        type: [string, 'null']
                      correo:
                        type: [string, 'null']
                        format: email
                      roles:
                        type: array
                        items: { type: string }
                        example: [administrador]
                      permisos:
                        type: array
                        items: { type: string }
                        example: ['iam:usuarios.leer', 'iam:usuarios.administrar']
                      csrf:
                        type: string
                        description: Token CSRF para el formulario de logout.
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/iam/v1/indicadores:
    get:
      tags: [Indicadores]
      summary: Indicadores del entorno
      description: |
        Los indicadores para la revisión de accesos del inicio del portal. `data` trae solo los bloques que permiten
        los permisos de quien pide (sin ninguno, un objeto vacío):

        | Bloque | Permiso |
        |---|---|
        | `entorno` | `iam:aplicaciones.leer` |
        | `personas`, `privilegios`, `senales` | `iam:usuarios.leer` |
        | `clientes` | `iam:clientes.leer` |
        | `auditoria` | `iam:auditoria.leer` |

        La **actividad** de una persona es la fecha del último access token que API-Auth le emitió (login o
        renovación). Las sesiones son las del login central con actividad en las últimas 2 horas. Cada bloque se
        calcula con consultas agregadas y se guarda 5 minutos; `meta.calculado_en` es el momento del bloque más
        antiguo. Nunca incluye contraseñas, secretos, tokens ni ids numéricos.
      operationId: verIndicadores
      security:
        - sesionPortal: []
      responses:
        '200':
          description: Los bloques permitidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicadores' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/iam/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: |
        Personas de IAM ordenadas por nombre, paginadas. `buscar` filtra por nombre o correo que contengan el texto
        (sin distinguir mayúsculas, sí tildes) y, si el texto es un RUT válido con o sin puntos, por ese RUT.
        Nunca incluye contraseñas, `entra_oid` ni ids internos.
      operationId: listarUsuarios
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre o del correo, o un RUT (`12.345.678-5`, `12345678-5` o `123456785`).
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [activos, baja, todos], default: todos }
        - name: inactivas
          in: query
          required: false
          description: |
            Sin actividad hace más de 30 o 90 días, o sin actividad nunca. La actividad es el último access token emitido
            a la persona, como en `/indicadores`: con `estado=activos`, `meta.total` coincide con `personas.inactivas_30`,
            `personas.inactivas_90` o `personas.sin_actividad`.
          schema: { type: string, enum: ['30', '90', nunca] }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de personas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UsuarioResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Usuarios]
      summary: Dar de alta una persona
      description: |
        Crea la persona sin roles, con el correo en minúsculas y sin espacios y el RUT normalizado (`12345678-K`). Con
        `acceso` `microsoft` queda sin clave: API-Auth la vincula por correo en su primer login con Microsoft, así que el
        correo debe ser el de su cuenta Microsoft. Con `clave` se genera una clave temporal que vence a las
        `IAM_CLAVE_TEMPORAL_HORAS` horas y que API-Auth obliga a cambiar en el primer ingreso: va **solo en esta
        respuesta** (`Cache-Control: no-store`) y nunca en logs ni en la auditoría. Queda en la auditoría como
        `usuario.creacion` con `{nombre, correo, rut, acceso}`. Exige `iam:usuarios.administrar`.
      operationId: crearUsuario
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, acceso]
              properties:
                nombre: { type: string, maxLength: 255, example: Ana Pérez }
                correo: { type: string, format: email, maxLength: 255, example: ana.perez@ubo.cl }
                rut:
                  type: [string, 'null']
                  description: Opcional, con o sin puntos; se valida el dígito verificador (módulo 11).
                  example: 12.345.678-5
                acceso:
                  type: string
                  enum: [microsoft, clave]
                  description: '`microsoft` (sin clave) o `clave` (clave temporal).'
      responses:
        '201':
          description: Persona creada. La clave temporal, si la hay, no se vuelve a mostrar.
          headers:
            Cache-Control:
              description: '`no-store`: ni el navegador ni un proxy guardan la respuesta.'
              schema: { type: string, example: 'no-store, private' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaCreada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '409':
          description: Otra persona ya usa ese correo, sin distinguir mayúsculas (`CORREO_EN_USO`), o ese RUT (`RUT_EN_USO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              examples:
                correo:
                  value:
                    type: about:blank
                    title: Correo en uso
                    status: 409
                    detail: Otra persona ya usa ese correo.
                    error: CORREO_EN_USO
                rut:
                  value:
                    type: about:blank
                    title: RUT en uso
                    status: 409
                    detail: Otra persona ya usa ese RUT.
                    error: RUT_EN_USO
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/usuarios/{uuid}:
    get:
      tags: [Usuarios]
      summary: Ver un usuario
      description: Datos de cuenta de la persona y sus roles agrupados por aplicación (ambos ordenados por nombre).
      operationId: verUsuario
      security:
        - sesionPortal: []
      parameters:
        - name: uuid
          in: path
          required: true
          description: Identificador público de la persona (sin distinguir mayúsculas).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La persona.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe una persona con ese `uuid`, o no tiene formato de UUID (`USUARIO_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Usuario no encontrado
                status: 404
                detail: No existe una persona con ese identificador.
                error: USUARIO_NO_ENCONTRADO

  /api/iam/v1/usuarios/{uuid}/roles:
    post:
      tags: [Usuarios]
      summary: Asignar un rol a una persona
      description: |
        Asigna el rol y lo registra en la auditoría (`usuario.rol.asignacion`). No cierra las sesiones: el rol rige
        cuando la persona renueva su token. Los roles de `iam-admin` exigen todos los permisos de `iam-admin`; nadie
        cambia sus propios roles. Cada rechazo queda en la auditoría.
      operationId: asignarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aplicacion, rol]
              properties:
                aplicacion: { type: string, maxLength: 100, example: pago-honorarios }
                rol: { type: string, maxLength: 100, example: revisor }
      responses:
        '201':
          description: Rol asignado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
        '200':
          description: La persona ya tenía el rol; no cambió nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoDeRoles' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/usuarios/{uuid}/roles/{aplicacion}/{rol}:
    delete:
      tags: [Usuarios]
      summary: Quitar un rol a una persona
      description: |
        Quita el rol, lo registra en la auditoría (`usuario.rol.retiro`) y después pide a API-Auth cerrar las sesiones
        de la persona. Si API-Auth falla, el rol queda quitado y `sesiones_revocadas` es `false`: se reintenta con
        `POST /usuarios/{uuid}/sesiones/revocar`.
      operationId: quitarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - name: aplicacion
          in: path
          required: true
          schema: { type: string, example: pago-honorarios }
        - name: rol
          in: path
          required: true
          schema: { type: string, example: revisor }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Rol quitado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sesiones_revocadas]
                    properties:
                      sesiones_revocadas:
                        type: boolean
                        description: API-Auth confirmó el cierre de las sesiones de la persona.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoDeRoles' }
        '404':
          description: No existe la persona (`USUARIO_NO_ENCONTRADO`) o no tiene ese rol (`ROL_NO_ASIGNADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Rol no asignado
                status: 404
                detail: La persona no tiene ese rol.
                error: ROL_NO_ASIGNADO
        '409':
          description: Es la última persona activa con `iam-admin/administrador` (`ULTIMO_ADMINISTRADOR`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Último administrador
                status: 409
                detail: 'Es la última persona activa con iam-admin/administrador: asigne el rol a otra persona antes de quitárselo.'
                error: ULTIMO_ADMINISTRADOR
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/usuarios/{uuid}/sesiones/revocar:
    post:
      tags: [Usuarios]
      summary: Cerrar las sesiones de una persona
      description: |
        Pide a API-Auth cerrar todas las sesiones de la persona; es el reintento cuando un retiro de rol respondió
        `sesiones_revocadas` `false`. Se audita (`usuario.sesiones.revocacion`) solo si API-Auth lo confirma.
      operationId: revocarSesiones
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: API-Auth cerró las sesiones.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoDeRoles' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }
        '502':
          description: API-Auth no confirmó el cierre (`REVOCACION_FALLIDA`); se puede reintentar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Revocación fallida
                status: 502
                detail: IAM no confirmó el cierre de las sesiones. Intente de nuevo en unos minutos.
                error: REVOCACION_FALLIDA

  /api/iam/v1/usuarios/{uuid}/baja:
    post:
      tags: [Usuarios]
      summary: Dar de baja a una persona
      description: |
        Pone `disabled_at` (la persona conserva sus roles), lo registra en la auditoría (`usuario.baja`,
        `{"activo": true}` → `{"activo": false}`) y después pide a API-Auth cerrar sus sesiones; API-Auth ya no le
        emite tokens. Si API-Auth falla, la baja queda guardada y `sesiones_revocadas` es `false`: se reintenta con
        `POST /usuarios/{uuid}/sesiones/revocar`. Si ya estaba de baja, responde 200 con `sesiones_revocadas` `null`
        sin cambiar ni auditar nada.
      operationId: darDeBaja
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Persona de baja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sesiones_revocadas]
                    properties:
                      sesiones_revocadas:
                        type: [boolean, 'null']
                        description: API-Auth confirmó el cierre de las sesiones; `null` si la persona ya estaba de baja.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoSobrePersona' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '409':
          description: Es la última persona activa con `iam-admin/administrador` (`ULTIMO_ADMINISTRADOR`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Último administrador
                status: 409
                detail: 'Es la última persona activa con iam-admin/administrador: asigne el rol a otra persona antes de darla de baja.'
                error: ULTIMO_ADMINISTRADOR
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/usuarios/{uuid}/reactivacion:
    post:
      tags: [Usuarios]
      summary: Reactivar a una persona
      description: |
        Quita `disabled_at` (la persona conserva sus roles) y lo registra en la auditoría como `usuario.alta`
        (`{"activo": false}` → `{"activo": true}`). Si ya estaba activa, responde 200 sin cambiar ni auditar nada.
      operationId: reactivar
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Persona activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activo]
                    properties:
                      activo: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoSobrePersona' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/usuarios/{uuid}/clave:
    post:
      tags: [Usuarios]
      summary: Reiniciar la clave de una persona
      description: |
        Genera una clave temporal nueva que vence a las `IAM_CLAVE_TEMPORAL_HORAS` horas, guarda solo su hash, lo
        registra en la auditoría (`usuario.clave.reinicio`, sin valores) y después pide a API-Auth cerrar las
        sesiones de la persona. La clave se muestra **una sola vez** (`Cache-Control: no-store`) y API-Auth obliga a
        cambiarla en el primer ingreso. A una persona que solo entraba con Microsoft le da además una clave.
      operationId: reiniciarClave
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/UuidPersona'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Clave reiniciada.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaveReiniciada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RechazoSobrePersona' }
        '404': { $ref: '#/components/responses/UsuarioNoEncontrado' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones:
    get:
      tags: [Aplicaciones]
      summary: Listar aplicaciones
      description: |
        Aplicaciones de IAM ordenadas por nombre, paginadas, con la cantidad de permisos y roles de cada una.
        `buscar` filtra por nombre o descripción que contengan el texto (sin distinguir mayúsculas).
        Nunca incluye ids internos.
      operationId: listarAplicaciones
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre o de la descripción.
          schema: { type: string, maxLength: 100 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de aplicaciones.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AplicacionResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Aplicaciones]
      summary: Crear una aplicación
      description: |
        Registra un sistema nuevo, sin permisos ni roles, y lo registra en la auditoría (`aplicacion.creacion`, con
        `nombre` y `descripcion` en `despues`). El nombre es un slug en minúsculas (`^[a-z0-9]+(-[a-z0-9]+)*$`, hasta
        100 caracteres), único, y no se cambia después. Exige `iam:aplicaciones.administrar`.
      operationId: crearAplicacion
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, maxLength: 100, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: biblioteca }
                descripcion: { type: [string, 'null'], maxLength: 255, example: Sistema de biblioteca }
      responses:
        '201':
          description: La aplicación creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ElementoDeCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '409':
          description: Ya existe una aplicación con ese nombre (`APLICACION_EXISTENTE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/aplicaciones/{nombre}:
    get:
      tags: [Aplicaciones]
      summary: Ver una aplicación
      description: La aplicación con sus permisos y sus roles, y los permisos que da cada rol (todo ordenado por nombre).
      operationId: verAplicacion
      security:
        - sesionPortal: []
      parameters:
        - name: nombre
          in: path
          required: true
          description: Nombre de la aplicación (sin distinguir mayúsculas).
          schema: { type: string, example: iam-admin }
      responses:
        '200':
          description: La aplicación.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AplicacionDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe una aplicación con ese nombre (`APLICACION_NO_ENCONTRADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Aplicación no encontrada
                status: 404
                detail: No existe una aplicación con ese nombre.
                error: APLICACION_NO_ENCONTRADA
    patch:
      tags: [Aplicaciones]
      summary: Cambiar la descripción de una aplicación
      description: |
        Cambia solo la descripción (el nombre no se cambia) y lo registra en la auditoría (`aplicacion.edicion`, con
        la descripción en `antes` y `despues`). La misma descripción responde 200 sin cambiar nada ni auditar.
        `iam-admin` responde 409 `CATALOGO_DE_IAM_ADMIN`. Exige `iam:aplicaciones.administrar`.
      operationId: editarAplicacion
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Descripcion' }
      responses:
        '200':
          description: La aplicación después del cambio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ElementoDeCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/AplicacionNoEncontrada' }
        '409': { $ref: '#/components/responses/CatalogoDeIamAdmin' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Aplicaciones]
      summary: Borrar una aplicación sin uso
      description: |
        Borra una aplicación creada por error y lo registra en la auditoría (`aplicacion.borrado`, con `nombre` y
        `descripcion` en `antes`). Si tiene permisos, roles o clientes está en uso: responde 409 `EN_USO` con el
        `impacto` y no borra nada. `iam-admin` responde 409 `CATALOGO_DE_IAM_ADMIN`. Exige
        `iam:aplicaciones.administrar`.
      operationId: borrarAplicacion
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200': { $ref: '#/components/responses/Borrado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/AplicacionNoEncontrada' }
        '409': { $ref: '#/components/responses/EnUso' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/permisos:
    post:
      tags: [Aplicaciones]
      summary: Crear un permiso de una aplicación
      description: |
        Crea un permiso (un scope OAuth) de la aplicación y lo registra en la auditoría (`permiso.creacion`, con
        `nombre`, `aplicacion` y `descripcion` en `despues`). El nombre lleva minúsculas, dígitos y `:._-`, empieza
        con letra o dígito, hasta 100 caracteres, y es único en todo IAM (`PERMISO_EXISTENTE`). La descripción es
        obligatoria. En `iam-admin` responde 409 `CATALOGO_DE_IAM_ADMIN`. Exige `iam:aplicaciones.administrar`.
      operationId: crearPermiso
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, descripcion]
              properties:
                nombre: { type: string, maxLength: 100, pattern: '^[a-z0-9][a-z0-9:._-]*$', example: 'biblioteca:prestamos.leer' }
                descripcion: { type: string, maxLength: 255, example: Ver préstamos }
      responses:
        '201':
          description: El permiso creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ElementoDeCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/AplicacionNoEncontrada' }
        '409':
          description: Ya existe un permiso con ese nombre (`PERMISO_EXISTENTE`) o la aplicación es `iam-admin` (`CATALOGO_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/aplicaciones/{nombre}/permisos/{permiso}:
    patch:
      tags: [Aplicaciones]
      summary: Cambiar la descripción de un permiso
      description: |
        Cambia solo la descripción, que es obligatoria, y lo registra en la auditoría (`permiso.edicion`, con la
        descripción en `antes` y `despues`). La misma descripción responde 200 sin cambiar nada ni auditar. Un
        permiso de otra aplicación responde 404. Los permisos de `iam-admin` responden 409 `CATALOGO_DE_IAM_ADMIN`.
        Exige `iam:aplicaciones.administrar`.
      operationId: editarPermiso
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - name: permiso
          in: path
          required: true
          description: Nombre del permiso.
          schema: { type: string, example: 'biblioteca:prestamos.leer' }
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descripcion]
              properties:
                descripcion: { type: string, maxLength: 255, example: Ver los préstamos vigentes }
      responses:
        '200':
          description: El permiso después del cambio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ElementoDeCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese permiso (`PERMISO_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/CatalogoDeIamAdmin' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Aplicaciones]
      summary: Borrar un permiso sin uso
      description: |
        Borra un permiso creado por error y lo registra en la auditoría (`permiso.borrado`, con `nombre` y
        `descripcion` en `antes`). Si algún rol lo da está en uso: responde 409 `EN_USO` con el `impacto` y no
        borra nada. Los permisos de `iam-admin` responden 409 `CATALOGO_DE_IAM_ADMIN`. Exige
        `iam:aplicaciones.administrar`.
      operationId: borrarPermiso
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/NombrePermiso'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200': { $ref: '#/components/responses/Borrado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese permiso (`PERMISO_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/EnUso' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/roles:
    post:
      tags: [Aplicaciones]
      summary: Crear un rol de una aplicación
      description: |
        Crea un rol de la aplicación, sin permisos, y lo registra en la auditoría (`rol.creacion`, con `nombre` como
        `aplicacion/rol` y `descripcion` en `despues`). El nombre lleva letras, dígitos, espacios o `._-`, sin `/`,
        hasta 100 caracteres, y es único en la aplicación sin distinguir mayúsculas (`ROL_EXISTENTE`). En
        `iam-admin` responde 409 `CATALOGO_DE_IAM_ADMIN`. Exige `iam:aplicaciones.administrar`.
      operationId: crearRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, maxLength: 100, pattern: '^[\p{L}\p{N}][\p{L}\p{N} ._-]*$', example: bibliotecario }
                descripcion: { type: [string, 'null'], maxLength: 255, example: Presta libros }
      responses:
        '201':
          description: El rol creado, sin permisos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/ElementoDeCatalogo'
                      - type: object
                        required: [permisos]
                        properties:
                          permisos: { type: array, items: { type: string }, maxItems: 0 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/AplicacionNoEncontrada' }
        '409':
          description: La aplicación ya tiene ese rol (`ROL_EXISTENTE`) o es `iam-admin` (`CATALOGO_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/aplicaciones/{nombre}/roles/{rol}:
    patch:
      tags: [Aplicaciones]
      summary: Cambiar la descripción de un rol
      description: |
        Cambia solo la descripción y lo registra en la auditoría (`rol.edicion`, con la descripción en `antes` y
        `despues`). La misma descripción responde 200 sin cambiar nada ni auditar. Los roles de `iam-admin` responden
        409 `CATALOGO_DE_IAM_ADMIN`. Exige `iam:aplicaciones.administrar`.
      operationId: editarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/NombreRol'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Descripcion' }
      responses:
        '200':
          description: El rol después del cambio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ElementoDeCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese rol (`ROL_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/CatalogoDeIamAdmin' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Aplicaciones]
      summary: Borrar un rol sin uso
      description: |
        Borra un rol creado por error y lo registra en la auditoría (`rol.borrado`, con `nombre` como
        `aplicacion/rol` y `descripcion` en `antes`); los permisos que daba siguen existiendo. Si alguna persona o
        cliente lo tiene está en uso: responde 409 `EN_USO` con el `impacto` y no borra nada. Los roles de
        `iam-admin` responden 409 `CATALOGO_DE_IAM_ADMIN`. Exige `iam:aplicaciones.administrar`.
      operationId: borrarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/NombreRol'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200': { $ref: '#/components/responses/Borrado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese rol (`ROL_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/EnUso' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/baja:
    post:
      tags: [Aplicaciones]
      summary: Dar de baja una aplicación
      description: |
        Retira un sistema de forma reversible: con `disabled_at`, API-Auth no deja entrar a nadie a ella, sus
        clientes no obtienen tokens y sus permisos no se conceden. No toca permisos, roles, clientes ni asignaciones.
        Sin `confirmar_baja: true` responde 409 `BAJA_SIN_CONFIRMAR` con el `impacto` (personas con roles en ella y
        sus clientes) y no cambia nada. Confirmada, se registra en la auditoría (`aplicacion.baja`, con
        `{"activo": true}` en `antes` y `{"activo": false}` en `despues`); si ya estaba de baja responde 200 sin
        cambiar nada ni auditar. `iam-admin` responde 409 `CATALOGO_DE_IAM_ADMIN`. Exige
        `iam:aplicaciones.administrar`.
      operationId: darDeBajaAplicacion
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmarBaja' }
      responses:
        '200':
          description: Quedó de baja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activa]
                    properties:
                      activa: { type: boolean, const: false }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/BajaSinConfirmar' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/reactivacion:
    post:
      tags: [Aplicaciones]
      summary: Reactivar una aplicación
      description: |
        Quita `disabled_at`: todo lo que tenía asignado vuelve a regir desde el siguiente token. Se registra en la
        auditoría (`aplicacion.alta`, con `{"activo": false}` en `antes` y `{"activo": true}` en `despues`); si ya
        estaba activa responde 200 sin cambiar nada ni auditar. No pide confirmación. Exige
        `iam:aplicaciones.administrar`.
      operationId: reactivarAplicacion
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Quedó activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activa]
                    properties:
                      activa: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/roles/{rol}/baja:
    post:
      tags: [Aplicaciones]
      summary: Dar de baja un rol
      description: |
        Retira un rol de forma reversible: con `disabled_at`, API-Auth deja de contarlo para el acceso, de conceder
        sus permisos (a personas y clientes) y de ponerlo en la claim `roles`. Las personas y clientes que lo tienen
        y los permisos que da se conservan. Sin `confirmar_baja: true` responde 409 `BAJA_SIN_CONFIRMAR` con el
        `impacto` del rol y no cambia nada. Confirmada, se registra en la auditoría (`rol.baja`, con
        `{"activo": true}` en `antes` y `{"activo": false}` en `despues`); si ya estaba de baja responde 200 sin
        cambiar nada ni auditar. Los roles de `iam-admin` responden 409 `CATALOGO_DE_IAM_ADMIN`. Exige
        `iam:aplicaciones.administrar`.
      operationId: darDeBajaRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/NombreRol'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmarBaja' }
      responses:
        '200':
          description: Quedó de baja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activo]
                    properties:
                      activo: { type: boolean, const: false }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese rol (`ROL_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/BajaSinConfirmar' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/roles/{rol}/reactivacion:
    post:
      tags: [Aplicaciones]
      summary: Reactivar un rol
      description: |
        Quita `disabled_at`: vuelve a dar acceso y permisos a quienes lo tienen desde el siguiente token. Se registra
        en la auditoría (`rol.alta`, con `{"activo": false}` en `antes` y `{"activo": true}` en `despues`); si ya
        estaba activo responde 200 sin cambiar nada ni auditar. No pide confirmación. Exige
        `iam:aplicaciones.administrar`.
      operationId: reactivarRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/NombreRol'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Quedó activo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activo]
                    properties:
                      activo: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese rol (`ROL_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/aplicaciones/{nombre}/roles/{rol}/permisos:
    put:
      tags: [Aplicaciones]
      summary: Fijar los permisos que da un rol
      description: |
        Reemplaza los permisos que da el rol por la lista recibida, de cualquier aplicación (una lista vacía los
        quita todos). Cada permiso agregado queda en la auditoría como `rol.permiso.asignacion` (`{"permiso": …}` en
        `despues`) y cada quitado como `rol.permiso.retiro` (en `antes`), en la misma transacción. La misma lista
        responde 200 sin cambiar nada ni auditar. Un permiso inexistente responde 422 sin cambiar nada. Los roles de
        `iam-admin`, y dar un permiso de `iam-admin` a otro rol, responden 409 `CATALOGO_DE_IAM_ADMIN`. API-Auth
        aplica el cambio desde el siguiente token de quienes tienen el rol. Exige `iam:aplicaciones.administrar`.
      operationId: cambiarPermisosDeRol
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/NombreAplicacion'
        - $ref: '#/components/parameters/NombreRol'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permisos]
              properties:
                permisos:
                  type: array
                  maxItems: 500
                  items: { type: string, maxLength: 100 }
                  example: ['biblioteca:prestamos.leer', 'geografia:leer']
      responses:
        '200':
          description: Los permisos que da el rol después del cambio, ordenados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [permisos]
                    properties:
                      permisos:
                        type: array
                        items: { type: string }
              example: { data: { permisos: ['biblioteca:prestamos.leer', 'geografia:leer'] } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe la aplicación (`APLICACION_NO_ENCONTRADA`) o no tiene ese rol (`ROL_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/CatalogoDeIamAdmin' }
        '419': { $ref: '#/components/responses/Csrf' }
        '422':
          description: Falta la lista o algún permiso no existe (mensaje en `errores.permisos`) (`VALIDACION`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaValidacion' }

  /api/iam/v1/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes OAuth
      description: |
        Clientes OAuth ordenados por nombre (y luego por id), paginados, con su aplicación, si están revocados y
        cuántos roles tienen. Incluye los revocados. `buscar` filtra por el nombre del cliente o de su aplicación
        (sin distinguir mayúsculas); si es un UUID, trae además el cliente con ese id. Nunca incluye el secreto.
      operationId: listarClientes
      security:
        - sesionPortal: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Parte del nombre del cliente o de su aplicación, o el id completo.
          schema: { type: string, maxLength: 100 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de clientes.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClienteResumen' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Clientes]
      summary: Crear un cliente OAuth
      description: |
        Crea un cliente confidencial de una aplicación, sin roles. `authorization-code` (login de personas) recibe las
        concesiones `authorization_code` y `refresh_token` y necesita al menos una redirección; `client-credentials`
        (servicio a servicio) recibe `client_credentials` y no lleva redirecciones. Cada redirección debe ser una URL
        absoluta `https` (o `http` en `localhost`), sin fragmento. El nombre no puede repetirse entre los clientes, sin
        distinguir mayúsculas. Los clientes de `iam-admin` solo los crea `iam:install`.

        El secreto va **solo en esta respuesta** (`Cache-Control: no-store`); se guarda solo su hash y nunca queda en
        logs ni en la auditoría, donde la creación queda como `cliente.creacion` con
        `{nombre, aplicacion, tipo, redirecciones}`. Exige `iam:clientes.administrar`.
      operationId: crearCliente
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, aplicacion, tipo]
              properties:
                nombre: { type: string, maxLength: 100, example: satelite-web }
                aplicacion:
                  type: string
                  description: Nombre de una aplicación existente, distinta de `iam-admin`.
                  example: satelite
                tipo:
                  type: string
                  enum: [authorization-code, client-credentials]
                redirecciones:
                  type: [array, 'null']
                  description: Obligatorias con `authorization-code`; prohibidas con `client-credentials`.
                  items: { type: string, format: uri, example: 'https://satelite.ubo.cl/auth/callback' }
      responses:
        '201':
          description: Cliente creado. El secreto no se vuelve a mostrar.
          headers:
            Cache-Control:
              description: '`no-store`: ni el navegador ni un proxy guardan la respuesta.'
              schema: { type: string, example: 'no-store, private' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteCreado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '409':
          description: Otro cliente ya usa ese nombre, sin distinguir mayúsculas (`CLIENTE_EXISTENTE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente existente
                status: 409
                detail: Ya existe un cliente con ese nombre.
                error: CLIENTE_EXISTENTE
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/clientes/{id}:
    get:
      tags: [Clientes]
      summary: Ver un cliente OAuth
      description: |
        El cliente con sus concesiones, sus redirecciones, si es confidencial y sus roles (con la aplicación de cada
        rol, que puede ser distinta de la del cliente). Nunca incluye el secreto ni su hash.
      operationId: verCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
      responses:
        '200':
          description: El cliente.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ClienteDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente no encontrado
                status: 404
                detail: No existe un cliente con ese id.
                error: CLIENTE_NO_ENCONTRADO

  /api/iam/v1/clientes/{id}/secreto:
    post:
      tags: [Clientes]
      summary: Rotar el secreto de un cliente OAuth
      description: |
        Genera un secreto nuevo de 40 caracteres para un cliente confidencial, guarda solo su hash bcrypt y lo
        registra en la auditoría (`cliente.secreto.rotacion`, sin el secreto ni su hash). El secreto anterior deja de
        servir de inmediato (los tokens ya emitidos siguen válidos hasta vencer). El secreto se muestra **una sola
        vez** (`Cache-Control: no-store`). Los clientes de `iam-admin` (`iam-admin-portal`, `iam-admin-sistema`)
        exigen `confirmar` con el nombre del cliente: rotarlos corta el login del portal o la revocación de sesiones
        hasta actualizar el `.env` de API-IAM con la variable que indica `variable_env`. Exige
        `iam:clientes.administrar`.
      operationId: rotarSecretoCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmar:
                  type: [string, 'null']
                  maxLength: 255
                  description: El nombre del cliente. Obligatorio solo para los clientes de `iam-admin`.
                  example: iam-admin-portal
      responses:
        '200':
          description: Secreto rotado. No se vuelve a mostrar.
          headers:
            Cache-Control:
              description: '`no-store`: ni el navegador ni un proxy guardan la respuesta.'
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretoRotado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: El cliente es público (PKCE, sin secreto) y no recibe uno (`CLIENTE_PUBLICO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente público
                status: 409
                detail: 'El cliente es público (PKCE): no tiene secreto que rotar.'
                error: CLIENTE_PUBLICO
        '419': { $ref: '#/components/responses/Csrf' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/clientes/{id}/revocacion:
    post:
      tags: [Clientes]
      summary: Revocar un cliente OAuth
      description: |
        Marca el cliente como revocado y lo registra en la auditoría (`cliente.revocacion`, `{"revocado": false}` →
        `{"revocado": true}`). API-Auth deja de emitir y renovar sus tokens y sus rutas los rechazan; con el cambio
        `introspeccion-cliente-revocado` de API-Auth, la introspección también reporta inactivos los tokens
        vigentes (sin él, siguen aceptados por las APIs que introspectan hasta vencer). Si ya estaba revocado,
        responde 200 sin cambiar nada ni auditar. Los clientes de `iam-admin` no se revocan: el intento responde 409
        y queda en la auditoría como `rechazado`. Exige `iam:clientes.administrar`.
      operationId: revocarCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: El cliente está revocado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeRevocacion' }
              example: { data: { revocado: true } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: El cliente es de `iam-admin`, que usa la propia API-IAM, y no se revoca (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente de iam-admin
                status: 409
                detail: 'El cliente es de iam-admin: API-IAM lo usa y no se cambia desde el portal.'
                error: CLIENTE_DE_IAM_ADMIN
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/clientes/{id}/reactivacion:
    post:
      tags: [Clientes]
      summary: Reactivar un cliente OAuth
      description: |
        Quita la marca de revocado y lo registra en la auditoría (`cliente.reactivacion`, `{"revocado": true}` →
        `{"revocado": false}`). Los tokens del cliente que no vencieron vuelven a valer: si se revocó por un secreto
        filtrado, rote el secreto antes de reactivar. Si ya estaba activo, responde 200 sin cambiar nada ni
        auditar. Los clientes de `iam-admin` sí se reactivan. Exige `iam:clientes.administrar`.
      operationId: reactivarCliente
      security:
        - sesionPortal: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
          schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: El cliente está activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeRevocacion' }
              example: { data: { revocado: false } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/clientes/{id}/roles:
    post:
      tags: [Clientes]
      summary: Asignar un rol a un cliente de servicio
      description: |
        Asigna a un cliente `client-credentials` un rol de cualquier aplicación y lo registra en la auditoría
        (`cliente.rol.asignacion`, `despues` `{"rol": "<aplicacion>/<rol>"}`). Sus tokens `client_credentials` llevan
        los scopes del rol desde el siguiente token. Si ya lo tenía, responde 200 sin cambiar nada ni auditar.
        Los clientes de login (`CLIENTE_SIN_ROLES`), los roles de `iam-admin` (`ROL_DE_IAM_ADMIN`) y los clientes
        de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`) responden 409 y el intento queda en la auditoría como `rechazado`.
        Exige `iam:clientes.administrar`.
      operationId: asignarRolACliente
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aplicacion, rol]
              properties:
                aplicacion: { type: string, maxLength: 100, example: api-maestros }
                rol: { type: string, maxLength: 100, example: maestros-lector }
      responses:
        '201':
          description: Rol asignado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
              example: { data: { asignado: true } }
        '200':
          description: El cliente ya tenía el rol; no cambió nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsignacion' }
              example: { data: { asignado: false } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/ClienteNoEncontrado' }
        '409':
          description: |
            El cliente es de login (`CLIENTE_SIN_ROLES`), el rol es de `iam-admin` (`ROL_DE_IAM_ADMIN`) o el cliente
            es de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Rol de iam-admin
                status: 409
                detail: Los roles de iam-admin no se asignan a clientes.
                error: ROL_DE_IAM_ADMIN
        '419': { $ref: '#/components/responses/Csrf' }
        '422':
          description: Faltan `aplicacion` o `rol`, o no existe ese rol en esa aplicación (`VALIDACION`, mensaje en `errores.rol`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaValidacion' }

  /api/iam/v1/clientes/{id}/roles/{aplicacion}/{rol}:
    delete:
      tags: [Clientes]
      summary: Quitar un rol a un cliente de servicio
      description: |
        Quita el rol y lo registra en la auditoría (`cliente.rol.retiro`, `antes` `{"rol": "<aplicacion>/<rol>"}`).
        Los tokens ya emitidos conservan sus scopes hasta vencer (máximo 60 minutos): el cambio rige en el siguiente
        token; si es urgente, revoque el cliente. Los clientes de login (`CLIENTE_SIN_ROLES`) y los de `iam-admin`
        (`CLIENTE_DE_IAM_ADMIN`) responden 409 y el intento queda en la auditoría como `rechazado`. Exige
        `iam:clientes.administrar`.
      operationId: quitarRolACliente
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - name: aplicacion
          in: path
          required: true
          schema: { type: string, example: api-maestros }
        - name: rol
          in: path
          required: true
          schema: { type: string, example: maestros-lector }
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Rol quitado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [quitado]
                    properties:
                      quitado: { type: boolean, const: true }
              example: { data: { quitado: true } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404':
          description: No existe el cliente (`CLIENTE_NO_ENCONTRADO`) o no tiene ese rol (`ROL_NO_ASIGNADO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Rol no asignado
                status: 404
                detail: El cliente no tiene ese rol.
                error: ROL_NO_ASIGNADO
        '409':
          description: El cliente es de login (`CLIENTE_SIN_ROLES`) o de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente sin roles
                status: 409
                detail: 'El cliente no es de servicio: sus tokens llevan los roles de la persona, no los del cliente.'
                error: CLIENTE_SIN_ROLES
        '419': { $ref: '#/components/responses/Csrf' }

  /api/iam/v1/clientes/{id}/redirecciones:
    put:
      tags: [Clientes]
      summary: Cambiar las redirecciones de un cliente de login
      description: |
        Reemplaza las redirecciones de un cliente `authorization-code` por la lista recibida (en ese orden, sin
        duplicados) y lo registra en la auditoría (`cliente.redirecciones.cambio`, con la lista anterior en `antes`
        y la nueva en `despues`). Si son las mismas, aunque en otro orden, responde 200 sin cambiar nada ni auditar.
        Exige al menos una, cada una `https` (o `http` en `localhost`) y sin fragmento. Los clientes de servicio
        (`CLIENTE_SIN_REDIRECCIONES`) y los de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`) responden 409 y el intento queda
        en la auditoría como `rechazado`. Exige `iam:clientes.administrar`.
      operationId: cambiarRedirecciones
      security:
        - sesionPortal: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirecciones]
              properties:
                redirecciones:
                  type: array
                  minItems: 1
                  items: { type: string, format: uri, maxLength: 2000 }
                  example: ['https://satelite.ubo.cl/auth/callback', 'https://satelite-qa.ubo.cl/auth/callback']
      responses:
        '200':
          description: Las redirecciones del cliente después del cambio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [redirecciones]
                    properties:
                      redirecciones:
                        type: array
                        items: { type: string, format: uri }
              example: { data: { redirecciones: ['https://satelite.ubo.cl/auth/callback', 'https://satelite-qa.ubo.cl/auth/callback'] } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/ClienteNoEncontrado' }
        '409':
          description: El cliente es de servicio (`CLIENTE_SIN_REDIRECCIONES`) o de `iam-admin` (`CLIENTE_DE_IAM_ADMIN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: about:blank
                title: Cliente sin redirecciones
                status: 409
                detail: 'El cliente no es de login: no usa redirecciones.'
                error: CLIENTE_SIN_REDIRECCIONES
        '419': { $ref: '#/components/responses/Csrf' }
        '422':
          description: |
            Lista vacía (mensaje en `errores.redirecciones`) o una redirección insegura (mensaje en
            `errores["redirecciones.<n>"]`) (`VALIDACION`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaValidacion' }

  /api/iam/v1/auditoria:
    get:
      tags: [Auditoria]
      summary: Consultar la auditoría
      description: |
        Entradas del registro de auditoría, de la más reciente a la más antigua, paginadas. Los filtros se combinan.
        El nombre y el correo del actor vienen de Usuarios mientras la persona exista. Consultar la auditoría no
        escribe en la base.
      operationId: listarAuditoria
      security:
        - sesionPortal: []
      parameters:
        - name: desde
          in: query
          required: false
          description: Primer día incluido (zona de la aplicación).
          schema: { type: string, format: date, example: '2026-11-09' }
        - name: hasta
          in: query
          required: false
          description: Último día incluido (zona de la aplicación); no puede ser anterior a `desde`.
          schema: { type: string, format: date, example: '2026-11-10' }
        - name: actor
          in: query
          required: false
          description: '`uuid` de la persona que hizo la acción.'
          schema: { type: string, format: uuid }
        - name: accion
          in: query
          required: false
          description: Prefijo del código de acción, por ejemplo `cliente.`.
          schema: { type: string, maxLength: 100 }
        - name: entidad_tipo
          in: query
          required: false
          schema: { type: string, maxLength: 50, example: cliente }
        - name: entidad_id
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: resultado
          in: query
          required: false
          schema: { type: string, enum: [ok, rechazado] }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Una página de entradas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EntradaAuditoria' }
                  meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/iam/v1/salud:
    get:
      tags: [Salud]
      summary: Estado de la API y de la base de datos
      description: |
        Ejecuta una consulta trivial en la base de datos `IAM`. Lo usa el healthcheck de nginx en
        `docker-compose.prod.yml`. Misma forma que en las demás APIs de la UBO (módulo Health de UBO.Common).
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [OK] }
                  base_datos: { type: string, enum: [OK] }
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [ERROR] }
                  base_datos: { type: string, enum: [NO_DISPONIBLE] }

components:
  securitySchemes:
    sesionPortal:
      type: apiKey
      in: cookie
      name: api-iam-session
      description: Cookie de sesión del portal, que se obtiene con el login. Su nombre real es el de `SESSION_COOKIE`.

  parameters:
    UuidPersona:
      name: uuid
      in: path
      required: true
      description: Identificador público de la persona (sin distinguir mayúsculas).
      schema: { type: string, format: uuid }
    IdCliente:
      name: id
      in: path
      required: true
      description: Id del cliente (el `client_id` OAuth, sin distinguir mayúsculas).
      schema: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
    NombreAplicacion:
      name: nombre
      in: path
      required: true
      description: Nombre de la aplicación (sin distinguir mayúsculas).
      schema: { type: string, example: biblioteca }
    NombrePermiso:
      name: permiso
      in: path
      required: true
      description: Nombre del permiso (sin distinguir mayúsculas).
      schema: { type: string, example: 'biblioteca:prestamos.leer' }
    NombreRol:
      name: rol
      in: path
      required: true
      description: Nombre del rol en la aplicación (sin distinguir mayúsculas; los espacios van codificados).
      schema: { type: string, example: bibliotecario }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token CSRF, tomado de la cookie `XSRF-TOKEN` (Angular lo envía solo).
      schema: { type: string }

  schemas:
    Problema:
      type: object
      description: Error en formato RFC 9457 (`application/problem+json`).
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, const: about:blank }
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de este caso en particular.
        error:
          type: string
          description: Código estable para el programa que llama (ver la descripción de la API).

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            error: { const: VALIDACION }
            errores:
              type: object
              description: Mensajes de error por campo.
              additionalProperties:
                type: array
                items: { type: string }

    Impacto:
      type: object
      description: |
        A quién afecta borrar un elemento del catálogo; solo conteos y nombres, nunca personas. Para una
        aplicación: `permisos`, `roles` y `clientes` (cantidades). Para un permiso: los `roles` que lo dan (como
        `aplicacion/rol`) y la cantidad de `personas` y `clientes` distintos que lo reciben por esos roles. Para un
        rol: la cantidad de `personas` y `clientes` que lo tienen y sus `permisos`. Para la baja de una aplicación:
        la cantidad de `personas` distintas con roles en ella y de sus `clientes`; para la baja de un rol, lo mismo
        que al borrarlo.
      properties:
        permisos:
          description: Cantidad (aplicación) o nombres de los permisos que da (rol).
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: array, items: { type: string } }
        roles:
          description: Cantidad (aplicación) o los roles que dan el permiso, como `aplicacion/rol` (permiso).
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: array, items: { type: string } }
        personas: { type: integer, minimum: 0 }
        clientes: { type: integer, minimum: 0 }
      example: { roles: ['biblioteca/bibliotecario'], personas: 3, clientes: 0 }

    ProblemaConImpacto:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            impacto:
              $ref: '#/components/schemas/Impacto'
              description: Solo en `EN_USO` y `BAJA_SIN_CONFIRMAR`.

    ConfirmarBaja:
      type: object
      properties:
        confirmar_baja:
          type: boolean
          description: Sin `true`, la baja responde 409 `BAJA_SIN_CONFIRMAR` con el `impacto` y no cambia nada.

    MetaPaginacion:
      type: object
      description: Paginación de una lista (`meta` de las respuestas que listan).
      required: [total, pagina, por_pagina]
      properties:
        total:
          type: integer
          description: Cantidad total de elementos que cumplen el filtro.
        pagina:
          type: integer
          minimum: 1
          description: Página devuelta.
        por_pagina:
          type: integer
          minimum: 1
          description: Elementos por página.

    UsuarioResumen:
      type: object
      required: [uuid, nombre, correo, rut, estado]
      properties:
        uuid:
          type: string
          format: uuid
          description: Identificador público de la persona, en minúsculas.
        nombre: { type: string, example: Ana Pérez }
        correo: { type: string, format: email, example: ana@ubo.cl }
        rut:
          type: [string, 'null']
          description: RUT normalizado (sin puntos, con guion y `K` mayúscula).
          example: 12345678-5
        estado:
          type: string
          enum: [activo, baja]

    UsuarioDetalle:
      allOf:
        - $ref: '#/components/schemas/UsuarioResumen'
        - type: object
          required: [baja_desde, tiene_clave, microsoft_vinculado, clave_temporal_vence, creado, actualizado, aplicaciones]
          properties:
            baja_desde:
              type: [string, 'null']
              format: date-time
              description: Desde cuándo está dada de baja.
            tiene_clave:
              type: boolean
              description: Tiene contraseña de IAM (sin revelarla).
            microsoft_vinculado:
              type: boolean
              description: Ya entró con su cuenta Microsoft.
            clave_temporal_vence:
              type: [string, 'null']
              format: date-time
              description: Vencimiento de la clave temporal, si la tiene.
            creado: { type: [string, 'null'], format: date-time }
            actualizado: { type: [string, 'null'], format: date-time }
            aplicaciones:
              type: array
              description: Aplicaciones donde la persona tiene roles.
              items:
                type: object
                required: [nombre, descripcion, roles]
                properties:
                  nombre: { type: string, example: iam-admin }
                  descripcion: { type: [string, 'null'] }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [nombre, descripcion]
                      properties:
                        nombre: { type: string, example: administrador }
                        descripcion: { type: [string, 'null'] }

    AplicacionResumen:
      type: object
      required: [nombre, descripcion, permisos, roles, baja_desde]
      properties:
        nombre:
          type: string
          description: Nombre único de la aplicación; la identifica en la URL.
          example: iam-admin
        descripcion: { type: [string, 'null'], example: Portal de administración de IAM }
        permisos:
          type: integer
          description: Cantidad de permisos que define.
          example: 7
        roles:
          type: integer
          description: Cantidad de roles que define.
          example: 2
        baja_desde:
          type: [string, 'null']
          format: date-time
          description: Desde cuándo está dada de baja; `null` si está activa.

    AplicacionDetalle:
      type: object
      required: [nombre, descripcion, creada, actualizada, baja_desde, permisos, roles]
      properties:
        nombre: { type: string, example: iam-admin }
        descripcion: { type: [string, 'null'] }
        creada: { type: [string, 'null'], format: date-time }
        actualizada: { type: [string, 'null'], format: date-time }
        baja_desde:
          type: [string, 'null']
          format: date-time
          description: Desde cuándo está dada de baja; `null` si está activa.
        permisos:
          type: array
          description: Permisos de la aplicación, ordenados por nombre.
          items:
            type: object
            required: [nombre, descripcion]
            properties:
              nombre: { type: string, example: 'iam:usuarios.leer' }
              descripcion: { type: string, example: Ver usuarios y sus roles }
        roles:
          type: array
          description: Roles de la aplicación, ordenados por nombre.
          items:
            type: object
            required: [nombre, descripcion, permisos, baja_desde]
            properties:
              nombre: { type: string, example: mesa-de-ayuda }
              descripcion: { type: [string, 'null'] }
              permisos:
                type: array
                description: Nombres de los permisos que da el rol, ordenados.
                items: { type: string }
                example: ['iam:aplicaciones.leer', 'iam:usuarios.administrar', 'iam:usuarios.leer']
              baja_desde:
                type: [string, 'null']
                format: date-time
                description: Desde cuándo está dado de baja; `null` si está activo.

    ElementoDeCatalogo:
      type: object
      description: Una aplicación, un permiso o un rol después de crearlo o cambiar su descripción. Nunca incluye ids internos.
      required: [nombre, descripcion]
      properties:
        nombre: { type: string, example: biblioteca }
        descripcion: { type: [string, 'null'], example: Sistema de biblioteca }

    Descripcion:
      type: object
      required: [descripcion]
      properties:
        descripcion:
          type: [string, 'null']
          maxLength: 255
          description: La nueva descripción; vacía o `null` la borra (salvo en los permisos, donde es obligatoria).
          example: Sistema de biblioteca

    ClienteResumen:
      type: object
      required: [id, nombre, aplicacion, revocado, roles]
      properties:
        id:
          type: string
          format: uuid
          description: El `client_id` OAuth, en minúsculas; identifica al cliente en la URL.
        nombre: { type: string, example: iam-admin-portal }
        aplicacion:
          type: string
          description: Nombre de la aplicación a la que pertenece.
          example: iam-admin
        revocado: { type: boolean }
        roles:
          type: integer
          description: Cantidad de roles asignados.
          example: 0

    ClienteDetalle:
      type: object
      required: [id, nombre, aplicacion, concesiones, confidencial, redirecciones, revocado, creado, actualizado, roles]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: iam-admin-sistema }
        aplicacion: { type: string, example: iam-admin }
        concesiones:
          type: array
          description: Tipos de concesión OAuth (`grant_types`) que puede usar.
          items: { type: string }
          example: [client_credentials]
        confidencial:
          type: boolean
          description: Tiene secreto (sin revelarlo).
        redirecciones:
          type: array
          description: Direcciones a las que puede volver tras el login (clientes authorization-code).
          items: { type: string, format: uri }
        revocado: { type: boolean }
        creado: { type: [string, 'null'], format: date-time }
        actualizado: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          description: Roles asignados, ordenados por aplicación y nombre.
          items:
            type: object
            required: [aplicacion, nombre, descripcion]
            properties:
              aplicacion:
                type: string
                description: Aplicación del rol; puede ser distinta de la del cliente.
                example: api-auth
              nombre: { type: string, example: introspector }
              descripcion: { type: [string, 'null'] }

    ResultadoAsignacion:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [asignado]
          properties:
            asignado:
              type: boolean
              description: '`true` si se asignó ahora; `false` si la persona o el cliente ya lo tenía.'

    PersonaCreada:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uuid, clave_temporal]
          properties:
            uuid: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-1b2c3d4e5f60 }
            clave_temporal:
              description: Solo con `acceso` `clave`; `null` con `microsoft`. Se muestra una sola vez.
              oneOf:
                - type: 'null'
                - type: object
                  required: [clave, vence]
                  properties:
                    clave: { type: string, pattern: '^[A-Za-z2-9]{4}-[A-Za-z2-9]{4}-[A-Za-z2-9]{4}$', example: Xk7m-P2qr-9Wzt }
                    vence: { type: string, format: date-time, example: '2026-11-13T12:00:00-03:00' }

    ClaveReiniciada:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [clave_temporal, sesiones_revocadas]
          properties:
            clave_temporal:
              description: Se muestra una sola vez.
              type: object
              required: [clave, vence]
              properties:
                clave: { type: string, pattern: '^[A-Za-z2-9]{4}-[A-Za-z2-9]{4}-[A-Za-z2-9]{4}$', example: Xk7m-P2qr-9Wzt }
                vence: { type: string, format: date-time, example: '2026-11-13T12:00:00-03:00' }
            sesiones_revocadas:
              type: boolean
              description: API-Auth confirmó el cierre de las sesiones; con `false` se reintenta con `POST /usuarios/{uuid}/sesiones/revocar`.

    ClienteCreado:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, secreto]
          properties:
            id: { type: string, format: uuid, example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b }
            secreto:
              type: string
              pattern: '^[A-Za-z0-9]{40}$'
              description: Se muestra una sola vez.
              example: 7fQx2Lm9Rk4Tz8Wb1Nc6Vd3Hj5Ps0Ya2Ge7Ku9Mi

    SecretoRotado:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [secreto, variable_env]
          properties:
            secreto:
              type: string
              pattern: '^[A-Za-z0-9]{40}$'
              description: Se muestra una sola vez.
              example: 7fQx2Lm9Rk4Tz8Wb1Nc6Vd3Hj5Ps0Ya2Ge7Ku9Mi
            variable_env:
              type: [string, 'null']
              enum: [UBO_LOGIN_CLIENT_SECRET, UBO_AUTH_CLIENT_SECRET, null]
              description: La variable del `.env` de API-IAM que hay que actualizar (clientes de `iam-admin`); `null` para los demás.

    EstadoDeRevocacion:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [revocado]
          properties:
            revocado:
              type: boolean
              description: El estado del cliente tras la acción.

    EntradaAuditoria:
      type: object
      required: [ocurrido_en, actor, accion, entidad, resultado, motivo, antes, despues, trace_id]
      properties:
        ocurrido_en: { type: string, format: date-time }
        actor:
          type: object
          required: [tipo, uuid, nombre, correo]
          properties:
            tipo: { type: string, enum: [persona, comando] }
            uuid: { type: [string, 'null'], format: uuid }
            nombre:
              type: [string, 'null']
              description: Nombre de la persona, si existe en IAM.
            correo: { type: [string, 'null'], format: email }
        accion:
          type: string
          description: Código estable de la acción.
          example: cliente.secreto.rotacion
        entidad:
          type: object
          required: [tipo, id, nombre]
          properties:
            tipo: { type: string, example: rol }
            id:
              type: string
              description: Identificador guardado (`uuid` para usuario y cliente; id numérico para aplicación, rol y permiso).
              example: '16'
            nombre:
              type: [string, 'null']
              description: |
                Nombre actual de la entidad (el rol como `aplicacion/rol`); `null` si ya no existe o su tipo no
                tiene nombre conocido.
              example: iam-admin/mesa-de-ayuda
        resultado: { type: string, enum: [ok, rechazado] }
        motivo:
          type: [string, 'null']
          description: Código del motivo de un intento rechazado.
          example: ESCALAMIENTO_DE_PRIVILEGIOS
        antes:
          type: [object, 'null']
          description: Campos auditables antes de la acción. Nunca contiene secretos.
        despues:
          type: [object, 'null']
          description: Campos auditables después de la acción. Nunca contiene secretos.
          example: { rol: iam-admin/administrador }
        trace_id:
          type: [string, 'null']
          description: '`trace_id` de la petición o del comando.'

    ClienteIndicado:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    Indicadores:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          description: Solo los bloques que permiten los permisos de quien pide.
          properties:
            entorno:
              type: object
              required: [aplicaciones, roles, permisos, roles_sin_asignar, roles_con_mas_personas]
              properties:
                aplicaciones: { type: integer }
                roles: { type: integer }
                permisos: { type: integer }
                roles_sin_asignar:
                  type: integer
                  description: Roles sin personas ni clientes.
                roles_con_mas_personas:
                  type: array
                  description: Los cinco roles con más personas activas.
                  items:
                    type: object
                    required: [aplicacion, rol, personas]
                    properties:
                      aplicacion: { type: string }
                      rol: { type: string }
                      personas: { type: integer }
            personas:
              type: object
              required: [activas, de_baja, inactivas_30, inactivas_90, sin_actividad, ingresos_por_dia, sesiones_abiertas, claves_temporales_vencidas, solo_clave]
              properties:
                activas: { type: integer }
                de_baja: { type: integer }
                inactivas_30:
                  type: integer
                  description: Activas cuya última actividad es de hace más de 30 días (no cuenta a las que nunca tuvieron).
                inactivas_90: { type: integer }
                sin_actividad:
                  type: integer
                  description: Activas sin ningún token emitido.
                ingresos_por_dia:
                  type: array
                  description: Los últimos 30 días, del más antiguo a hoy, con personas distintas que recibieron un token ese día.
                  items:
                    type: object
                    required: [fecha, personas]
                    properties:
                      fecha: { type: string, format: date }
                      personas: { type: integer }
                sesiones_abiertas:
                  type: integer
                  description: Personas con sesión del login central activa en las últimas 2 horas.
                claves_temporales_vencidas: { type: integer }
                solo_clave:
                  type: integer
                  description: Activas con clave y sin cuenta Microsoft vinculada.
            privilegios:
              type: object
              required: [administradores, administradores_inactivos]
              properties:
                administradores:
                  type: integer
                  description: Personas activas con `iam-admin/administrador`.
                administradores_inactivos:
                  type: array
                  description: Administradores sin actividad hace más de 30 días o nunca.
                  items:
                    type: object
                    required: [uuid, nombre, ultima_actividad]
                    properties:
                      uuid: { type: string, format: uuid }
                      nombre: { type: string }
                      ultima_actividad: { type: [string, 'null'], format: date-time }
            clientes:
              type: object
              required: [login, servicio, revocados, tokens_24h, tokens_7d, tokens_por_cliente, sin_uso_30, sin_roles, secretos_sin_rotar]
              properties:
                login:
                  type: integer
                  description: Clientes no revocados con `authorization_code`.
                servicio:
                  type: integer
                  description: Clientes no revocados con `client_credentials`.
                revocados: { type: integer }
                tokens_24h:
                  type: integer
                  description: Tokens de servicio (sin persona) emitidos en las últimas 24 horas.
                tokens_7d: { type: integer }
                tokens_por_cliente:
                  type: array
                  description: Los diez clientes con más tokens de servicio en 7 días.
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ClienteIndicado'
                      - type: object
                        required: [tokens_24h, tokens_7d]
                        properties:
                          tokens_24h: { type: integer }
                          tokens_7d: { type: integer }
                sin_uso_30:
                  type: array
                  description: Clientes de servicio activos, creados hace más de 30 días, sin tokens en los últimos 30.
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ClienteIndicado'
                      - type: object
                        required: [ultimo_uso]
                        properties:
                          ultimo_uso: { type: [string, 'null'], format: date-time }
                sin_roles:
                  type: array
                  description: Clientes de servicio activos sin roles.
                  items: { $ref: '#/components/schemas/ClienteIndicado' }
                secretos_sin_rotar:
                  type: array
                  description: |
                    Clientes confidenciales activos cuyo secreto tiene más de 180 días: la última `cliente.secreto.rotacion`
                    de la auditoría o, si nunca se rotó, la creación.
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ClienteIndicado'
                      - type: object
                        required: [secreto_desde]
                        properties:
                          secreto_desde: { type: [string, 'null'], format: date-time }
            auditoria:
              type: object
              required: [rechazos, cambios_7d]
              properties:
                rechazos:
                  type: object
                  description: Rechazos de los últimos 30 días por `motivo`.
                  additionalProperties: { type: integer }
                  example: { ESCALAMIENTO_DE_PRIVILEGIOS: 3, ACCION_SOBRE_SI_MISMO: 1 }
                cambios_7d:
                  type: integer
                  description: Acciones aplicadas (`ok`) en los últimos 7 días.
            senales:
              type: object
              required: [sesiones_desde_varias_ips]
              properties:
                sesiones_desde_varias_ips:
                  type: array
                  description: |
                    Personas con sesiones del login central abiertas a la vez desde más de una IP (señal débil hasta que
                    API-Auth registre los eventos de autenticación). No muestra las IP.
                  items:
                    type: object
                    required: [uuid, nombre, ips]
                    properties:
                      uuid: { type: string, format: uuid }
                      nombre: { type: string }
                      ips: { type: integer }
        meta:
          type: object
          required: [calculado_en]
          properties:
            calculado_en:
              type: string
              format: date-time
              description: Cuándo se calculó el bloque más antiguo de la respuesta (se guarda 5 minutos).

  responses:
    NoAutenticado:
      description: No hay sesión del portal (`NO_AUTENTICADO`). Angular debe navegar a `/api/iam/v1/auth/login`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Se requiere un token de acceso válido, vigente y no revocado.
            error: NO_AUTENTICADO
    AccesoDenegado:
      description: La persona no tiene el permiso `iam:*` que exige la ruta (`ACCESO_DENEGADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    RechazoDeRoles:
      description: |
        Sin el permiso de la ruta (`ACCESO_DENEGADO`), un rol de `iam-admin` sin todos los permisos de `iam-admin`
        (`ESCALAMIENTO_DE_PRIVILEGIOS`) o una acción sobre uno mismo (`ACCION_SOBRE_SI_MISMO`). Los dos últimos quedan
        en la auditoría como `rechazado`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Escalamiento de privilegios
            status: 403
            detail: Para asignar o quitar roles de iam-admin necesita todos los permisos de iam-admin.
            error: ESCALAMIENTO_DE_PRIVILEGIOS
    RechazoSobrePersona:
      description: |
        Sin el permiso de la ruta (`ACCESO_DENEGADO`), una persona con roles de `iam-admin` sin todos los permisos de
        `iam-admin` (`ESCALAMIENTO_DE_PRIVILEGIOS`) o una acción sobre uno mismo (`ACCION_SOBRE_SI_MISMO`). Los dos
        últimos quedan en la auditoría como `rechazado`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Escalamiento de privilegios
            status: 403
            detail: Para actuar sobre una persona con roles de iam-admin necesita todos los permisos de iam-admin.
            error: ESCALAMIENTO_DE_PRIVILEGIOS
    UsuarioNoEncontrado:
      description: No existe una persona con ese `uuid`, o no tiene formato de UUID (`USUARIO_NO_ENCONTRADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ClienteNoEncontrado:
      description: El id no es un UUID o no existe un cliente con ese id (`CLIENTE_NO_ENCONTRADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    AplicacionNoEncontrada:
      description: No existe una aplicación con ese nombre (`APLICACION_NO_ENCONTRADA`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    CatalogoDeIamAdmin:
      description: |
        El catálogo de `iam-admin` no se cambia desde el portal (`CATALOGO_DE_IAM_ADMIN`). El intento queda en la
        auditoría como `rechazado`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Catálogo de iam-admin
            status: 409
            detail: El catálogo de iam-admin no se cambia desde el portal.
            error: CATALOGO_DE_IAM_ADMIN
    Borrado:
      description: Se borró.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [borrado]
                properties:
                  borrado: { type: boolean, const: true }
    EnUso:
      description: |
        Está en uso (`EN_USO`, con el `impacto`) y no se borra nada, o es de `iam-admin` (`CATALOGO_DE_IAM_ADMIN`,
        auditado como `rechazado`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaConImpacto' }
          example:
            type: about:blank
            title: En uso
            status: 409
            detail: No se borra porque está en uso.
            error: EN_USO
            impacto: { roles: ['biblioteca/bibliotecario'], personas: 3, clientes: 0 }
    BajaSinConfirmar:
      description: |
        Falta `confirmar_baja: true` (`BAJA_SIN_CONFIRMAR`, con el `impacto`) y no cambia nada, o es de `iam-admin`
        (`CATALOGO_DE_IAM_ADMIN`, auditado como `rechazado`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaConImpacto' }
          example:
            type: about:blank
            title: Baja sin confirmar
            status: 409
            detail: 'Confirma la baja: quienes la usan pierden el acceso o los permisos que da.'
            error: BAJA_SIN_CONFIRMAR
            impacto: { personas: 5, clientes: 2 }
    Csrf:
      description: Falta el token CSRF (header `X-XSRF-TOKEN`) o no es válido.
    Validacion:
      description: Datos inválidos (`VALIDACION`), con los mensajes por campo en `errores`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
    ErrorInterno:
      description: Error inesperado (`ERROR_INTERNO`). El detalle queda solo en el log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Error interno
            status: 500
            detail: Ocurrió un error inesperado.
            error: ERROR_INTERNO
